name: Firebase - E2E

# Playwright end-to-end tests against the Firebase Emulator Suite. As in
# firebase-emulator-test.yml, the consumer's script owns the emulator lifecycle
# (`firebase emulators:exec ... "playwright test"`); Playwright's own webServer
# builds and serves the frontend. This job only provides Node, a JDK and the
# browsers, and keeps the HTML report when something fails.

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner type'
        required: false
        type: string
        default: 'ubuntu-latest'
      node_version_file:
        description: 'File setup-node reads the Node.js version from'
        required: false
        type: string
        default: '.nvmrc'
      java_version:
        description: 'Temurin JDK for the emulators'
        required: false
        type: string
        default: '21'
      scripts:
        description: 'Space-separated root package.json scripts that run the E2E suite'
        required: false
        type: string
        default: 'test:e2e'
      playwright_browsers:
        description: 'Space-separated browsers for `playwright install --with-deps`'
        required: false
        type: string
        default: 'chromium'
      report_dir:
        description: 'Playwright HTML report directory, uploaded on failure'
        required: false
        type: string
        default: 'playwright-report'
      timeout_minutes:
        description: 'Job timeout'
        required: false
        type: number
        default: 30

# Least privilege for what this workflow actually does. Without it the
# job inherits whatever the calling repository's default happens to be,
# which on older repositories is write-all.
permissions:
  contents: read

jobs:
  e2e:
    name: E2E
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ${{ inputs.node_version_file }}
          cache: pnpm

      - name: Setup Java ${{ inputs.java_version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        env:
          BROWSERS: ${{ inputs.playwright_browsers }}
        run: |
          set -euo pipefail
          for browser in $BROWSERS; do
            if ! [[ "$browser" =~ ^[a-z-]+$ ]]; then
              echo "::error::Invalid browser name: $browser"
              exit 1
            fi
          done
          # Word splitting is the point: one argument per browser.
          # shellcheck disable=SC2086
          pnpm exec playwright install --with-deps $BROWSERS

      - name: Run scripts
        env:
          SCRIPTS: ${{ inputs.scripts }}
          CI: 'true'
        run: |
          set -euo pipefail
          for script in $SCRIPTS; do
            if ! [[ "$script" =~ ^[A-Za-z0-9:_.-]+$ ]]; then
              echo "::error::Invalid script name: $script"
              exit 1
            fi
          done
          for script in $SCRIPTS; do
            echo "::group::pnpm run $script"
            pnpm run "$script"
            echo "::endgroup::"
          done

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: ${{ inputs.report_dir }}
          retention-days: 7
          if-no-files-found: ignore
