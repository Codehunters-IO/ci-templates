name: Firebase - Static Checks

# Checks that need neither Java nor an emulator: lint, typecheck, architecture
# rules, unit tests. Each entry in `scripts` is a root package.json script run
# with `pnpm run`, so the consumer decides what "static" means for its repo.
#
# pnpm and its version come from the consumer's `packageManager` field, Node from
# its `.nvmrc` (or whatever `node_version_file` names). There is deliberately no
# input to relax pnpm's minimumReleaseAge: a lockfile that names a package
# younger than the policy fails `pnpm install --frozen-lockfile` here exactly as
# it does locally. Exempt specific packages with `minimumReleaseAgeExclude` in
# the consumer's pnpm-workspace.yaml, where the exemption is reviewed and visible.

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner type'
        required: false
        type: string
        default: 'ubuntu-latest'
      node_version_file:
        description: 'File setup-node reads the Node.js version from'
        required: false
        type: string
        default: '.nvmrc'
      scripts:
        description: 'Space-separated root package.json scripts, run in order'
        required: false
        type: string
        default: 'lint typecheck test:unit'
      timeout_minutes:
        description: 'Job timeout'
        required: false
        type: number
        default: 15

# Least privilege for what this workflow actually does. Without it the
# job inherits whatever the calling repository's default happens to be,
# which on older repositories is write-all.
permissions:
  contents: read

jobs:
  static:
    name: Static Checks
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ${{ inputs.node_version_file }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run scripts
        env:
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          set -euo pipefail
          # Script names reach a shell. Restrict them to what package.json
          # script names look like so an input can never become a command.
          for script in $SCRIPTS; do
            if ! [[ "$script" =~ ^[A-Za-z0-9:_.-]+$ ]]; then
              echo "::error::Invalid script name: $script"
              exit 1
            fi
          done
          for script in $SCRIPTS; do
            echo "::group::pnpm run $script"
            pnpm run "$script"
            echo "::endgroup::"
          done
