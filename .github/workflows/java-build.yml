name: Java - Build

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner type'
        required: false
        type: string
        default: 'ubuntu-latest'
      java_version:
        description: 'Java version'
        required: false
        type: string
        default: '21'
      java_distribution:
        description: 'Java distribution (temurin, corretto, zulu, etc.)'
        required: false
        type: string
        default: 'temurin'
      run_spotless:
        description: 'Run Spotless code formatting check'
        required: false
        type: boolean
        default: true
      build_tool:
        description: 'Build tool: gradle or maven'
        required: false
        type: string
        default: 'gradle'
      upload_artifact:
        description: 'Upload the built JAR so downstream jobs (Docker/ECR) reuse it instead of recompiling'
        required: false
        type: boolean
        default: true
      jar_path:
        description: 'Directory to search for the bootable JAR'
        required: false
        type: string
        default: 'bootstrap/build/libs'
      artifact_retention_days:
        description: 'Days to retain the uploaded JAR artifact'
        required: false
        type: number
        default: 1

    outputs:
      artifact_name:
        description: 'Name of the uploaded JAR artifact (empty when upload_artifact is false)'
        value: ${{ jobs.build.outputs.artifact_name }}

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15

    outputs:
      artifact_name: ${{ steps.jar-info.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.java_distribution }}
          java-version: ${{ inputs.java_version }}

      - name: Setup Gradle
        if: inputs.build_tool == 'gradle'
        uses: gradle/actions/setup-gradle@v4
        with:
          # Build is the cache PRODUCER: always write so the downstream test job reuses
          # compileJava outputs from the Gradle build cache instead of recompiling.
          cache-read-only: false

      - name: Build (Gradle)
        if: inputs.build_tool == 'gradle'
        env:
          GH_PACKAGES_USERNAME: ${{ secrets.GH_PACKAGES_USERNAME }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: ./gradlew clean build -x test --no-daemon --build-cache --parallel

      - name: Build (Maven)
        if: inputs.build_tool == 'maven'
        env:
          GH_PACKAGES_USERNAME: ${{ secrets.GH_PACKAGES_USERNAME }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: mvn clean package -DskipTests -B

      - name: Spotless check
        if: inputs.run_spotless && inputs.build_tool == 'gradle'
        run: ./gradlew spotlessCheck --no-daemon --build-cache

      # ============================================
      # UPLOAD JAR — reused by the Docker/ECR job (no recompile downstream)
      # ============================================
      - name: Locate bootable JAR
        id: jar-info
        if: inputs.upload_artifact
        run: |
          JAR_FILE="$(find "${{ inputs.jar_path }}" -name '*.jar' -not -name '*-plain.jar' | head -1)"
          if [ -z "$JAR_FILE" ]; then
            echo "::error::No bootable JAR found under '${{ inputs.jar_path }}'."
            exit 1
          fi
          echo "name=build-artifact-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "file=$JAR_FILE" >> "$GITHUB_OUTPUT"
          echo "Bootable JAR: $JAR_FILE"

      - name: Upload JAR artifact
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.jar-info.outputs.name }}
          path: ${{ steps.jar-info.outputs.file }}
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error
          compression-level: 0   # JAR is already a compressed zip; recompressing wastes runner time

      # ============================================
      # CLEANUP
      # ============================================
      - name: Cleanup Gradle daemon
        if: inputs.build_tool == 'gradle' && always()
        run: |
          rm -rf ~/.gradle/daemon
          ./gradlew --stop 2>/dev/null || true
