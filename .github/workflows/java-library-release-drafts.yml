name: Java Library - Release Drafts

# Drafts one GitHub release per module version that has no tag yet, in a multi-module Gradle
# library repository. Merging publishes nothing: a person reviews a draft and publishes it, which
# creates the tag and starts java-library-publish.yml for that module only.
#
# Contract with the calling repository: a Gradle task (`candidates_task`, default
# `releaseCandidate`) that writes `build/release-candidates/*.txt` files of
# `<tag> <gradle path> <project dir>` lines, one per releasable module. A tag that exists is
# skipped, an existing draft is moved to this commit with fresh notes, otherwise a draft is
# created. The notes are the `## <version>` section of `<project dir>/CHANGELOG.md`.

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner type'
        required: false
        type: string
        default: 'ubuntu-latest'
      java_version:
        description: 'Java version'
        required: false
        type: string
        default: '21'
      java_distribution:
        description: 'Java distribution'
        required: false
        type: string
        default: 'temurin'
      candidates_task:
        description: 'Gradle task that writes build/release-candidates/*.txt'
        required: false
        type: string
        default: 'releaseCandidate'
      build_before_drafting:
        description: 'Run ./gradlew build with the candidates task, so only a commit that builds gets drafts'
        required: false
        type: boolean
        default: true
      tag_pattern:
        description: 'Extended regex every candidate tag must match'
        required: false
        type: string
        default: '^[a-z0-9][a-z0-9-]*/v[0-9]+\.[0-9]+\.[0-9]+$'
      maven_group:
        description: 'Maven group named in the release notes (e.g. io.example); empty leaves it out'
        required: false
        type: string
        default: ''
      docker_images:
        description: 'Container images the integration tests start, one per line (see java-library-build.yml)'
        required: false
        type: string
        default: ''
      timeout_minutes:
        description: 'Build job timeout in minutes'
        required: false
        type: number
        default: 30

permissions:
  contents: read

jobs:
  candidates:
    name: Build and list candidates
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # The build runs tests, containers and third-party plugins: it gets no write access.
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JDK ${{ inputs.java_version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: ${{ inputs.java_distribution }}
          java-version: ${{ inputs.java_version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: Pull the integration-test images
        if: inputs.docker_images != '' && inputs.build_before_drafting
        env:
          IMAGES: ${{ inputs.docker_images }}
        run: |
          set -euo pipefail
          mirrors=("mirror.gcr.io" "public.ecr.aws/docker")

          # Docker Hub names official images without library/; the mirrors need it.
          qualified() {
            if [[ "$1" == */* ]]; then echo "$1"; else echo "library/$1"; fi
          }

          # A mirrored image is tagged with its Docker Hub name, the one Testcontainers looks up.
          pull_from_mirror() {
            local mirror mirrored
            for mirror in "${mirrors[@]}"; do
              mirrored="$mirror/$(qualified "$1")"
              if docker pull --quiet "$mirrored"; then
                docker tag "$mirrored" "$1"
                echo "pulled $1 from $mirror"
                return 0
              fi
              echo "::warning::docker pull $mirrored failed"
            done
            return 1
          }

          pull() {
            local attempt
            for attempt in 1 2; do
              if docker pull --quiet "$1" || pull_from_mirror "$1"; then
                return 0
              fi
              echo "::warning::could not pull $1 from Docker Hub or its mirrors (attempt $attempt)"
              sleep 30
            done
            echo "::error::could not pull $1"
            return 1
          }

          while read -r image; do
            [ -n "$image" ] || continue
            pull "$image"
          done <<< "$IMAGES"

      - name: List release candidates
        env:
          TASK: ${{ inputs.candidates_task }}
          BUILD: ${{ inputs.build_before_drafting }}
        run: |
          set -euo pipefail
          if [ "$BUILD" = true ]; then ./gradlew build "$TASK"; else ./gradlew "$TASK"; fi
          cat build/release-candidates/*.txt > release-candidates.txt 2>/dev/null || true
          cat release-candidates.txt

      - name: Upload the release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-candidates
          path: release-candidates.txt
          if-no-files-found: error

  drafts:
    name: Draft releases
    needs: candidates
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # Credentials stay: `git ls-remote --tags origin` checks which tags exist.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Fetch the release candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-candidates

      - name: Draft releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_PATTERN: ${{ inputs.tag_pattern }}
          MAVEN_GROUP: ${{ inputs.maven_group }}
        run: |
          set -euo pipefail

          # Prints the `## <version>` section of a CHANGELOG, without its heading.
          changelog_section() {
            [ -f "$1" ] || return 0
            awk -v version="$2" '
              /^## / {
                heading = $2
                gsub(/[\[\]]/, "", heading)
                sub(/^v/, "", heading)
                if (inside) exit
                inside = (heading == version)
                next
              }
              inside { print }
            ' "$1"
          }

          release_notes() {
            local module="$1" version="$2" dir="$3" notes
            notes="$(mktemp)"
            changelog_section "$dir/CHANGELOG.md" "$version" > "$notes"
            if [ ! -s "$notes" ]; then
              echo "$module $version. See the CHANGELOG.md of \`$dir\`." > "$notes"
            fi
            if [ -n "$MAVEN_GROUP" ]; then
              # Backticks are a Markdown code span, not a substitution.
              # shellcheck disable=SC2016
              printf '\n---\nPublishing this release uploads `%s:%s:%s`.\n' \
                "$MAVEN_GROUP" "$module" "$version" >> "$notes"
            fi
            echo "$notes"
          }

          draft_state() {
            gh release view "$1" --json isDraft --jq '.isDraft' 2>/dev/null || echo "none"
          }

          while read -r tag path dir; do
            [ -n "${tag:-}" ] || continue
            if [[ ! "$tag" =~ $TAG_PATTERN ]]; then
              echo "::error::invalid release tag '$tag' from $path"
              exit 1
            fi
            if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
              echo "skip $tag (released)"
              continue
            fi
            version="${tag##*/v}"
            module="${path##*:}"
            notes="$(release_notes "$module" "$version" "$dir")"
            case "$(draft_state "$tag")" in
              true)
                gh release edit "$tag" --target "$GITHUB_SHA" --notes-file "$notes"
                echo "updated draft $tag"
                ;;
              false)
                echo "skip $tag (published, tag pending)"
                ;;
              *)
                gh release create "$tag" --draft --target "$GITHUB_SHA" \
                  --title "$module $version" --notes-file "$notes"
                echo "drafted $tag"
                ;;
            esac
          done < release-candidates.txt
