name: Java - OWASP Dependency Check

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner type'
        required: false
        type: string
        default: 'ubuntu-latest'
      container_image:
        description: >-
          Run the job inside this image (e.g.
          ghcr.io/codehunters-io/ci-base-images:1.0.0). Empty = plain runner
          with actions/setup-java. The image already carries the JDK, so the
          per-run download is skipped and the version is pinned to the tag.
          Gradle still comes from ./gradlew, and setup-gradle still runs for
          its dependency cache.
        required: false
        type: string
        default: ''
      java_version:
        description: 'Java version (ignored when container_image is set)'
        required: false
        type: string
        default: '21'
      java_distribution:
        description: 'Java distribution'
        required: false
        type: string
        default: 'temurin'
      owasp_fail_on_cvss:
        description: 'Fail on any vulnerability with a CVSS score at or above this (7 = HIGH and up, 9 = CRITICAL only, 4 = MEDIUM and up)'
        required: false
        type: number
        default: 7
      build_tool:
        description: 'Build tool: gradle or maven'
        required: false
        type: string
        default: 'gradle'

    secrets:
      NVD_API_KEY:
        required: false
      GH_PACKAGES_USERNAME:
        description: 'GitHub Packages username (for dependencies hosted on GitHub Packages)'
        required: false
      GH_PACKAGES_TOKEN:
        description: 'GitHub Packages read token'
        required: false

    outputs:
      vulnerabilities:
        description: 'Total number of vulnerabilities found'
        value: ${{ jobs.owasp.outputs.vulns }}
      critical:
        description: 'Number of CRITICAL vulnerabilities'
        value: ${{ jobs.owasp.outputs.critical }}
      high:
        description: 'Number of HIGH vulnerabilities'
        value: ${{ jobs.owasp.outputs.high }}

# Least privilege for what this workflow actually does. Without it the
# job inherits whatever the calling repository's default happens to be,
# which on older repositories is write-all.
permissions:
  contents: read
  packages: read

jobs:
  owasp:
    name: OWASP Dependency Check
    runs-on: ${{ inputs.runner }}
    # `container:` takes an object or nothing at all, and there is no way to
    # write "no container" as a string. fromJSON('null') is how you say it.
    container: ${{ inputs.container_image != '' && fromJSON(format('{{"image":"{0}"}}', inputs.container_image)) || fromJSON('null') }}
    timeout-minutes: 30

    outputs:
      vulns: ${{ steps.owasp-check.outputs.vulnerabilities }}
      critical: ${{ steps.owasp-check.outputs.critical }}
      high: ${{ steps.owasp-check.outputs.high }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup JDK ${{ inputs.java_version }}
        if: inputs.container_image == ''
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: ${{ inputs.java_distribution }}
          java-version: ${{ inputs.java_version }}

      - name: Report toolchain (container)
        if: inputs.container_image != ''
        run: |
          echo "Container: ${{ inputs.container_image }}"
          java -version

      - name: Setup Gradle
        if: inputs.build_tool == 'gradle'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
          # The NVD database (~/.gradle/dependency-check-data) is hundreds of MB of H2 files.
          # The Gradle home cache saved a truncated copy, and every later run restored it and
          # failed with MVStoreException before analysing anything. With an NVD_API_KEY a
          # fresh download takes a few minutes, which a weekly scan can afford.
          gradle-home-cache-excludes: dependency-check-data

      # ============================================
      # RUN OWASP DEPENDENCY CHECK
      # ============================================
      - name: Run OWASP Dependency Check (Gradle)
        id: owasp-check
        if: inputs.build_tool == 'gradle'
        # bash: mapfile and arrays; a container image's default sh has neither.
        shell: bash
        env:
          THRESHOLD: ${{ inputs.owasp_fail_on_cvss }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GH_PACKAGES_USERNAME: ${{ secrets.GH_PACKAGES_USERNAME }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          echo "Running OWASP Dependency Check..."

          OWASP_CMD="./gradlew dependencyCheckAnalyze --no-daemon --build-cache"
          if [ -n "$NVD_API_KEY" ]; then
            OWASP_CMD="$OWASP_CMD -DnvdApiKey=$NVD_API_KEY"
          fi

          # A non-zero exit is expected when the project sets failBuildOnCVSS: the report
          # below is what this job gates on. Only a missing report is fatal.
          set +e
          $OWASP_CMD
          OWASP_EXIT=$?
          set -e

          # Every report, not only the root project's: without the aggregate task each
          # module writes its own. Finding none used to count zero vulnerabilities, so an
          # NVD download failure passed the gate as "No blocking vulnerabilities found".
          # Anywhere under a build/reports/ directory: dependency-check-gradle 13 writes to
          # build/reports/dependency-check/, earlier versions to build/reports/.
          mapfile -t REPORTS < <(find . -name dependency-check-report.json -path "*/build/reports/*" -not -path "*/node_modules/*")
          if [ "${#REPORTS[@]}" -eq 0 ]; then
            echo "dependency-check-report files anywhere in the workspace:"
            find . -name 'dependency-check-report*' -not -path "*/node_modules/*" || true
            echo "::error::dependency-check wrote no report (exit $OWASP_EXIT); the scan did not run, see its log above"
            exit 1
          fi

          count() {
            jq -s --arg s "$1" '[.[].dependencies[]?.vulnerabilities[]? | select(.severity == $s)] | length' "${REPORTS[@]}"
          }
          CRITICAL=$(count CRITICAL); HIGH=$(count HIGH); MEDIUM=$(count MEDIUM); LOW=$(count LOW)
          VULNS=$((CRITICAL + HIGH + MEDIUM + LOW))
          # Blocking = scored at or above owasp_fail_on_cvss: the CVSS v3 base score, else v2,
          # else the severity's lower bound (CRITICAL 9, HIGH 7, MEDIUM 4, LOW 0.1) for sources
          # that publish no score.
          BLOCKING=$(jq -s --argjson t "$THRESHOLD" '
            def score: .cvssv3.baseScore // .cvssv2.score
              // ({"CRITICAL": 9, "HIGH": 7, "MEDIUM": 4, "LOW": 0.1}[(.severity // "") | ascii_upcase] // 0);
            [.[].dependencies[]?.vulnerabilities[]? | select(score >= $t)] | length' "${REPORTS[@]}")

          echo "vulnerabilities=$VULNS" >> $GITHUB_OUTPUT
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "blocking=$BLOCKING" >> $GITHUB_OUTPUT

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### OWASP Dependency Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| CRITICAL | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| HIGH | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| MEDIUM | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
          echo "| LOW | $LOW |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total** | **$VULNS** |" >> $GITHUB_STEP_SUMMARY

      - name: Run OWASP Dependency Check (Maven)
        id: owasp-check-maven
        if: inputs.build_tool == 'maven'
        # bash: mapfile and arrays; a container image's default sh has neither.
        shell: bash
        env:
          THRESHOLD: ${{ inputs.owasp_fail_on_cvss }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          echo "Running OWASP Dependency Check..."

          MVN_CMD="mvn org.owasp:dependency-check-maven:check -B"
          if [ -n "$NVD_API_KEY" ]; then
            MVN_CMD="$MVN_CMD -DnvdApiKey=$NVD_API_KEY"
          fi

          set +e
          $MVN_CMD
          OWASP_EXIT=$?
          set -e

          # Every module's report; none at all means the scan did not run (see the Gradle step).
          mapfile -t REPORTS < <(find . -name dependency-check-report.json -path "*/target/*" -not -path "*/node_modules/*")
          if [ "${#REPORTS[@]}" -eq 0 ]; then
            echo "dependency-check-report files anywhere in the workspace:"
            find . -name 'dependency-check-report*' -not -path "*/node_modules/*" || true
            echo "::error::dependency-check wrote no report (exit $OWASP_EXIT); the scan did not run, see its log above"
            exit 1
          fi

          count() {
            jq -s --arg s "$1" '[.[].dependencies[]?.vulnerabilities[]? | select(.severity == $s)] | length' "${REPORTS[@]}"
          }
          CRITICAL=$(count CRITICAL); HIGH=$(count HIGH)
          VULNS=$((CRITICAL + HIGH))
          # Blocking = scored at or above owasp_fail_on_cvss: the CVSS v3 base score, else v2,
          # else the severity's lower bound (CRITICAL 9, HIGH 7, MEDIUM 4, LOW 0.1) for sources
          # that publish no score.
          BLOCKING=$(jq -s --argjson t "$THRESHOLD" '
            def score: .cvssv3.baseScore // .cvssv2.score
              // ({"CRITICAL": 9, "HIGH": 7, "MEDIUM": 4, "LOW": 0.1}[(.severity // "") | ascii_upcase] // 0);
            [.[].dependencies[]?.vulnerabilities[]? | select(score >= $t)] | length' "${REPORTS[@]}")

          echo "vulnerabilities=$VULNS" >> $GITHUB_OUTPUT
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "blocking=$BLOCKING" >> $GITHUB_OUTPUT

      # ============================================
      # CHECK THRESHOLDS
      # ============================================
      - name: Check OWASP vulnerabilities
        env:
          BLOCKING: ${{ steps.owasp-check.outputs.blocking || steps.owasp-check-maven.outputs.blocking }}
          THRESHOLD: ${{ inputs.owasp_fail_on_cvss }}
        run: |
          # The scan steps fail on their own when no report exists, so an empty count here
          # means the step did not run: fail rather than pass.
          if [ -z "$BLOCKING" ]; then
            echo "::error::no vulnerability count from the scan step"
            exit 1
          fi
          if [ "$BLOCKING" -gt 0 ]; then
            echo "::error::Found $BLOCKING vulnerabilities with a CVSS score of $THRESHOLD or more"
            exit 1
          fi
          echo "No vulnerabilities with a CVSS score of $THRESHOLD or more"
