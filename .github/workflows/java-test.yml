name: Java - Test

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner type'
        required: false
        type: string
        default: 'ubuntu-latest'
      container_image:
        description: >-
          Run the job inside this image (e.g.
          ghcr.io/codehunters-io/ci-base-images:1.0.0). Empty = plain runner
          with actions/setup-java. The image already carries the JDK, so the
          per-run download is skipped and the version is pinned to the tag.
          Gradle still comes from ./gradlew, and setup-gradle still runs for
          its dependency cache.
        required: false
        type: string
        default: ''
      java_version:
        description: 'Java version (ignored when container_image is set)'
        required: false
        type: string
        default: '21'
      java_distribution:
        description: 'Java distribution'
        required: false
        type: string
        default: 'temurin'
      run_coverage:
        description: 'Run JaCoCo coverage report'
        required: false
        type: boolean
        default: true
      coverage_instruction_threshold:
        description: 'Minimum instruction coverage percentage (0-100). Set to 0 to disable. Requires jacocoLogCodeCoverage task.'
        required: false
        type: number
        default: 0
      coverage_branch_threshold:
        description: 'Minimum branch coverage percentage (0-100). Set to 0 to disable. Requires jacocoLogCodeCoverage task.'
        required: false
        type: number
        default: 0
      coverage_line_threshold:
        description: 'Minimum line coverage percentage (0-100). Set to 0 to disable.'
        required: false
        type: number
        default: 0
      run_code_analysis:
        description: 'Run code analysis'
        required: false
        type: boolean
        default: false
      code_analysis_tool:
        description: 'Code analysis tool: sonar or qodana'
        required: false
        type: string
        default: 'sonar'
      skip_quality_gate:
        description: 'Skip Quality Gate check'
        required: false
        type: boolean
        default: false
      run_owasp:
        description: 'Run OWASP Dependency Check'
        required: false
        type: boolean
        default: false
      owasp_fail_on_cvss:
        description: 'CVSS score threshold to fail build (7 = HIGH+CRITICAL, 9 = CRITICAL only)'
        required: false
        type: number
        default: 7
      upload_reports:
        description: 'Upload test reports as artifact'
        required: false
        type: boolean
        default: false
      upload_artifact:
        description: 'Upload build artifact (JAR)'
        required: false
        type: boolean
        default: true
      jar_path:
        description: 'Path to search for JAR files'
        required: false
        type: string
        default: 'bootstrap/build/libs'
      artifact_retention_days:
        description: 'Days to retain uploaded artifact'
        required: false
        type: number
        default: 1
      disable_artifacts:
        description: 'Disable all artifact uploads'
        required: false
        type: boolean
        default: true
      build_tool:
        description: 'Build tool: gradle or maven'
        required: false
        type: string
        default: 'gradle'
      test_tasks:
        description: >-
          Gradle tasks the test step runs. `check` runs every verification task the build
          defines (per-module coverage rules, convention checks), not only the tests.
        required: false
        type: string
        default: 'test jacocoTestReport'
      extra_gradle_commands:
        description: >-
          Further Gradle invocations after the tests, one per line, each passed to ./gradlew
          as is (e.g. "-p build-logic test" for an included build). A failure fails the job.
        required: false
        type: string
        default: ''
      docker_images:
        description: >-
          Container images the integration tests start, one per line. Pulled before the
          tests, from Docker Hub and then from its public mirrors (mirror.gcr.io,
          public.ecr.aws/docker). Testcontainers otherwise pulls lazily and reports a failed
          Docker Hub pull only as ContainerFetchException after a five-minute wait.
        required: false
        type: string
        default: ''

    outputs:
      result:
        description: 'Test result (success/failure)'
        value: ${{ jobs.test.outputs.result }}
      coverage_percentage:
        description: 'Code coverage percentage (line)'
        value: ${{ jobs.test.outputs.coverage }}
      coverage_instruction:
        description: 'Instruction coverage percentage (from jacocoLogCodeCoverage)'
        value: ${{ jobs.test.outputs.coverage_instruction }}
      coverage_branch:
        description: 'Branch coverage percentage (from jacocoLogCodeCoverage)'
        value: ${{ jobs.test.outputs.coverage_branch }}
      tests_passed:
        description: 'Number of tests passed'
        value: ${{ jobs.test.outputs.passed }}
      tests_failed:
        description: 'Number of tests failed'
        value: ${{ jobs.test.outputs.failed }}
      tests_skipped:
        description: 'Number of tests skipped'
        value: ${{ jobs.test.outputs.skipped }}
      quality_gate_status:
        description: 'SonarQube Quality Gate status (OK/ERROR)'
        value: ${{ jobs.test.outputs.quality_gate }}
      artifact_name:
        description: 'Name of uploaded artifact'
        value: ${{ jobs.test.outputs.artifact_name }}

# Least privilege for what this workflow actually does. Without it the
# job inherits whatever the calling repository's default happens to be,
# which on older repositories is write-all.
permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Test
    runs-on: ${{ inputs.runner }}
    # `container:` takes an object or nothing at all, and there is no way to
    # write "no container" as a string. fromJSON('null') is how you say it.
    container: ${{ inputs.container_image != '' && fromJSON(format('{{"image":"{0}"}}', inputs.container_image)) || fromJSON('null') }}
    timeout-minutes: 30

    outputs:
      result: ${{ steps.test-check.outcome }}
      coverage: ${{ steps.coverage.outputs.percentage }}
      coverage_instruction: ${{ steps.jacoco-log.outputs.instruction_pct }}
      coverage_branch: ${{ steps.jacoco-log.outputs.branch_pct }}
      quality_gate: ${{ steps.quality-gate.outputs.quality-gate-status }}
      passed: ${{ steps.test-summary.outputs.passed }}
      failed: ${{ steps.test-summary.outputs.failed }}
      skipped: ${{ steps.test-summary.outputs.skipped }}
      artifact_name: ${{ steps.artifact-info.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup JDK ${{ inputs.java_version }}
        if: inputs.container_image == ''
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: ${{ inputs.java_distribution }}
          java-version: ${{ inputs.java_version }}

      - name: Report toolchain (container)
        if: inputs.container_image != ''
        run: |
          echo "Container: ${{ inputs.container_image }}"
          java -version

      - name: Setup Gradle
        if: inputs.build_tool == 'gradle'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      # ============================================
      # RUN TESTS
      # ============================================
      - name: Pull the integration-test images
        if: inputs.docker_images != ''
        shell: bash
        env:
          IMAGES: ${{ inputs.docker_images }}
        run: |
          set -euo pipefail
          mirrors=("mirror.gcr.io" "public.ecr.aws/docker")

          # Docker Hub names official images without library/; the mirrors need it.
          qualified() {
            if [[ "$1" == */* ]]; then echo "$1"; else echo "library/$1"; fi
          }

          # A mirrored image is tagged with its Docker Hub name, the one Testcontainers looks up.
          pull_from_mirror() {
            local mirror mirrored
            for mirror in "${mirrors[@]}"; do
              mirrored="$mirror/$(qualified "$1")"
              if docker pull --quiet "$mirrored"; then
                docker tag "$mirrored" "$1"
                echo "pulled $1 from $mirror"
                return 0
              fi
              echo "::warning::docker pull $mirrored failed"
            done
            return 1
          }

          pull() {
            local attempt
            for attempt in 1 2; do
              if docker pull --quiet "$1" || pull_from_mirror "$1"; then
                return 0
              fi
              echo "::warning::could not pull $1 from Docker Hub or its mirrors (attempt $attempt)"
              sleep 30
            done
            echo "::error::could not pull $1"
            return 1
          }

          while read -r image; do
            [ -n "$image" ] || continue
            pull "$image"
          done <<< "$IMAGES"

      - name: Run tests (Gradle)
        id: test-run
        if: inputs.build_tool == 'gradle'
        env:
          GH_PACKAGES_USERNAME: ${{ secrets.GH_PACKAGES_USERNAME }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        # No 'clean build': compileJava is served FROM-CACHE (produced by the build job via
        # --build-cache). Only test sources compile here, then tests + coverage run. The jar
        # is NOT re-assembled (the build job already built and uploaded it).
        # The exit code is recorded, not swallowed: the report steps below still run, and
        # "Check test results" fails on it. A bare `|| true` here turned a test-compilation
        # error, or a failing test the XML scan below did not find, into a green job.
          TEST_TASKS: ${{ inputs.test_tasks }}
        run: |
          set +e
          # Word splitting is the point: TEST_TASKS is a list of Gradle tasks.
          # shellcheck disable=SC2086
          ./gradlew $TEST_TASKS --no-daemon --build-cache --parallel
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Extra Gradle commands
        if: inputs.build_tool == 'gradle' && inputs.extra_gradle_commands != ''
        shell: bash
        env:
          GH_PACKAGES_USERNAME: ${{ secrets.GH_PACKAGES_USERNAME }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          COMMANDS: ${{ inputs.extra_gradle_commands }}
        run: |
          set -euo pipefail
          while read -r line; do
            [ -n "$line" ] || continue
            echo "::group::./gradlew $line"
            # Word splitting is the point: each line is a list of Gradle arguments.
            # shellcheck disable=SC2086
            ./gradlew $line --no-daemon --build-cache
            echo "::endgroup::"
          done <<< "$COMMANDS"

      - name: Run tests (Maven)
        id: test-run-maven
        if: inputs.build_tool == 'maven'
        env:
          GH_PACKAGES_USERNAME: ${{ secrets.GH_PACKAGES_USERNAME }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          set +e
          mvn clean verify -B
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # ============================================
      # SONAR ANALYSIS (optional)
      # ============================================
      - name: Run SonarQube Analysis (Gradle)
        if: inputs.run_code_analysis && inputs.code_analysis_tool == 'sonar' && inputs.build_tool == 'gradle'
        env:
          GH_PACKAGES_USERNAME: ${{ secrets.GH_PACKAGES_USERNAME }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew sonar \
            -Dsonar.token="${SONAR_TOKEN}" \
            --no-daemon --build-cache

      - name: Run SonarQube Analysis (Maven)
        if: inputs.run_code_analysis && inputs.code_analysis_tool == 'sonar' && inputs.build_tool == 'maven'
        env:
          GH_PACKAGES_USERNAME: ${{ secrets.GH_PACKAGES_USERNAME }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.token="${SONAR_TOKEN}" \
            -B

      - name: SonarQube Quality Gate
        id: quality-gate
        if: inputs.run_code_analysis && inputs.code_analysis_tool == 'sonar' && !inputs.skip_quality_gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Gradle: build/sonar/ | Maven/CLI: .scannerwork/
          REPORT_FILE=$(find . -name "report-task.txt" \( -path "*/build/sonar/*" -o -path "*/.scannerwork/*" \) 2>/dev/null | head -1)

          if [ -z "$REPORT_FILE" ]; then
            echo "::warning::No report-task.txt found, listing build directories for debug:"
            find . -type d -name "sonar" -o -type d -name ".scannerwork" 2>/dev/null || true
            echo "::error::Cannot check Quality Gate without report-task.txt"
            exit 1
          fi

          echo "Found report: $REPORT_FILE"
          cat "$REPORT_FILE"

          # Extract ceTaskId, server URL, and dashboard URL from report
          CE_TASK_ID=$(grep "ceTaskId=" "$REPORT_FILE" | cut -d'=' -f2)
          SERVER_URL=$(grep "serverUrl=" "$REPORT_FILE" | cut -d'=' -f2)
          DASHBOARD_URL=$(grep "dashboardUrl=" "$REPORT_FILE" | cut -d'=' -f2-)

          if [ -z "$CE_TASK_ID" ]; then
            echo "::error::ceTaskId not found in report-task.txt"
            exit 1
          fi

          echo "Waiting for analysis task $CE_TASK_ID to complete..."

          # Poll CE task status (max 5 min)
          for i in $(seq 1 30); do
            TASK_STATUS=$(curl -s -u "${SONAR_TOKEN}:" \
              "${SERVER_URL}/api/ce/task?id=${CE_TASK_ID}" \
              | jq -r '.task.status // empty')

            echo "  Attempt $i/30 - task status: $TASK_STATUS"

            if [ "$TASK_STATUS" = "SUCCESS" ]; then
              break
            elif [ "$TASK_STATUS" = "FAILED" ] || [ "$TASK_STATUS" = "CANCELED" ]; then
              echo "::error::SonarQube analysis task $TASK_STATUS"
              exit 1
            fi

            sleep 10
          done

          if [ "$TASK_STATUS" != "SUCCESS" ]; then
            echo "::error::Timed out waiting for SonarQube analysis"
            exit 1
          fi

          # Get Quality Gate status
          ANALYSIS_ID=$(curl -s -u "${SONAR_TOKEN}:" \
            "${SERVER_URL}/api/ce/task?id=${CE_TASK_ID}" \
            | jq -r '.task.analysisId')

          QG_RESPONSE=$(curl -s -u "${SONAR_TOKEN}:" \
            "${SERVER_URL}/api/qualitygates/project_status?analysisId=${ANALYSIS_ID}")

          STATUS=$(echo "$QG_RESPONSE" | jq -r '.projectStatus.status')

          echo "quality-gate-status=$STATUS" >> $GITHUB_OUTPUT

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### SonarQube Quality Gate" >> $GITHUB_STEP_SUMMARY

          if [ "$STATUS" = "OK" ]; then
            echo "**Quality Gate: PASSED** — [View in SonarQube]($DASHBOARD_URL)" >> $GITHUB_STEP_SUMMARY
          else
            # Extract failed conditions with details
            FAILED_CONDITIONS=$(echo "$QG_RESPONSE" | jq -r '
              .projectStatus.conditions[]
              | select(.status == "ERROR")
              | "| \(.metricKey) | \(.actualValue) | \(.errorThreshold) |"
            ')

            echo "**Quality Gate: FAILED**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Failed Conditions" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Actual | Threshold |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|--------|-----------|" >> $GITHUB_STEP_SUMMARY
            echo "$FAILED_CONDITIONS" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "[View details in SonarQube]($DASHBOARD_URL)" >> $GITHUB_STEP_SUMMARY

            echo "::error::Quality Gate FAILED — See details: $DASHBOARD_URL"
            echo "Failed conditions:"
            echo "$QG_RESPONSE" | jq -r '
              .projectStatus.conditions[]
              | select(.status == "ERROR")
              | "  \(.metricKey): \(.actualValue) (threshold: \(.errorThreshold))"
            '
            exit 1
          fi

      - name: JaCoCo Log Code Coverage
        id: jacoco-log
        if: inputs.run_coverage && always()
        run: |
          # Check if the jacocoLogCodeCoverage task exists in the project
          if ./gradlew tasks --all 2>/dev/null | grep -q "jacocoLogCodeCoverage"; then
            echo "Running jacocoLogCodeCoverage..."
            LOG_OUTPUT=$(./gradlew jacocoLogCodeCoverage --no-daemon --build-cache 2>&1) || true
            echo "$LOG_OUTPUT"

            # Parse TOTAL line to extract coverage percentages
            TOTAL_LINE=$(echo "$LOG_OUTPUT" | grep -E "^\s*TOTAL" | head -1)
            if [ -n "$TOTAL_LINE" ]; then
              INSTRUCTION_PCT=$(echo "$TOTAL_LINE" | awk '{print $2}' | sed 's/%//')
              BRANCH_PCT=$(echo "$TOTAL_LINE" | awk '{print $3}' | sed 's/%//')
              LINE_PCT=$(echo "$TOTAL_LINE" | awk '{print $4}' | sed 's/%//')

              echo "instruction_pct=$INSTRUCTION_PCT" >> $GITHUB_OUTPUT
              echo "branch_pct=$BRANCH_PCT" >> $GITHUB_OUTPUT
              echo "line_pct=$LINE_PCT" >> $GITHUB_OUTPUT
              echo "has_log=true" >> $GITHUB_OUTPUT

              # Write coverage summary to job summary
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### JaCoCo Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY

              # Extract module lines (between header separator and TOTAL separator)
              echo "| Module | Instruction% | Branch% | Line% |" >> $GITHUB_STEP_SUMMARY
              echo "|--------|-------------|---------|-------|" >> $GITHUB_STEP_SUMMARY
              echo "$LOG_OUTPUT" | awk '/JaCoCo Code Coverage Summary/{found=1; next} found && /^[[:space:]]*-+/{count++; next} found && count>=2 && !/^[[:space:]]*-+/ && !/^[[:space:]]*Module/ && NF>=4 {printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4}' >> $GITHUB_STEP_SUMMARY
            else
              echo "has_log=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "jacocoLogCodeCoverage task not found, skipping."
            echo "has_log=false" >> $GITHUB_OUTPUT
          fi

      # bash, not the container default: these steps use bash-only syntax, and without it a
      # bash-less image fails with a syntax error instead of a clear "bash: not found".
      - name: Parse test results
        id: test-summary
        if: always()
        shell: bash
        run: |
          PASSED=0
          FAILED=0
          SKIPPED=0

          # Every module's Gradle and Maven reports, not just the root project's: in a
          # multi-module build (domain/, application/, bootstrap/...) the root has none, and
          # scanning only ./build/test-results counted zero failures whatever happened.
          # NUL-delimited: report paths come from test class names, and a word-split `for`
          # breaks on the first one with a space in a parameterised display name.
          while IFS= read -r -d '' file; do
            if [ -f "$file" ]; then
              FILE_TESTS=$(grep -oP 'tests="\K[0-9]+' "$file" 2>/dev/null | head -1 || echo "0")
              FILE_FAILURES=$(grep -oP 'failures="\K[0-9]+' "$file" 2>/dev/null | head -1 || echo "0")
              FILE_ERRORS=$(grep -oP 'errors="\K[0-9]+' "$file" 2>/dev/null | head -1 || echo "0")
              FILE_SKIPPED=$(grep -oP 'skipped="\K[0-9]+' "$file" 2>/dev/null | head -1 || echo "0")

              TOTAL_FAILED=$((FILE_FAILURES + FILE_ERRORS))
              FILE_PASSED=$((FILE_TESTS - TOTAL_FAILED - FILE_SKIPPED))

              PASSED=$((PASSED + FILE_PASSED))
              FAILED=$((FAILED + TOTAL_FAILED))
              SKIPPED=$((SKIPPED + FILE_SKIPPED))
            fi
          done < <(find . -name "*.xml" \( -path "*/build/test-results/*" -o -path "*/target/surefire-reports/*" \) \
                     -not -path "*/node_modules/*" -print0 2>/dev/null)

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT

          TOTAL=$((PASSED + FAILED + SKIPPED))
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| Skipped | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY

      - name: Publish JaCoCo Report
        if: inputs.run_coverage && always()
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920  # v1.8.0
        with:
          paths: ${{ github.workspace }}/**/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: ${{ inputs.coverage_line_threshold }}
          min-coverage-changed-files: ${{ inputs.coverage_line_threshold }}
          title: "Code Coverage Report"
          update-comment: true

      - name: Parse coverage report
        id: coverage
        if: inputs.run_coverage && always()
        run: |
          TOTAL_MISSED=0
          TOTAL_COVERED=0

          # Find all JaCoCo CSV reports (supports multi-module projects)
          CSV_FILES=$(find . -path "*/jacoco/*.csv" -name "*.csv" 2>/dev/null)

          if [ -z "$CSV_FILES" ]; then
            echo "::warning::No JaCoCo CSV reports found"
            echo "percentage=0" >> $GITHUB_OUTPUT
            echo "### Code Coverage" >> $GITHUB_STEP_SUMMARY
            echo "**Line Coverage: 0%** (no reports found)" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "=== JaCoCo Coverage Report ==="
          echo ""

          while IFS= read -r CSV_FILE; do
            MODULE=$(echo "$CSV_FILE" | sed 's|^\./||;s|/build/.*||')
            MISSED=$(awk -F',' 'NR>1 {sum+=$8} END {print sum+0}' "$CSV_FILE" 2>/dev/null)
            COVERED=$(awk -F',' 'NR>1 {sum+=$9} END {print sum+0}' "$CSV_FILE" 2>/dev/null)
            TOTAL=$((MISSED + COVERED))

            if [ "$TOTAL" -gt 0 ]; then
              MOD_COV=$(awk "BEGIN {printf \"%.1f\", ($COVERED / $TOTAL) * 100}")
              echo "  $MODULE: ${MOD_COV}% (${COVERED}/${TOTAL} lines)"
            fi

            TOTAL_MISSED=$((TOTAL_MISSED + MISSED))
            TOTAL_COVERED=$((TOTAL_COVERED + COVERED))
          done <<< "$CSV_FILES"

          COVERAGE=0
          if [ "$((TOTAL_MISSED + TOTAL_COVERED))" -gt 0 ]; then
            COVERAGE=$(awk "BEGIN {printf \"%.1f\", ($TOTAL_COVERED / ($TOTAL_MISSED + $TOTAL_COVERED)) * 100}")
          fi

          echo ""
          echo "  Total: ${COVERAGE}% (${TOTAL_COVERED}/$((TOTAL_MISSED + TOTAL_COVERED)) lines)"
          echo "================================"

          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Code Coverage" >> $GITHUB_STEP_SUMMARY
          echo "**Line Coverage: ${COVERAGE}%**" >> $GITHUB_STEP_SUMMARY

      # Thresholds are `number` inputs, so a caller may pass 80.5. `[ -gt ]` takes
      # integers only: on a decimal it errors, the `if` reads that as false, and the
      # gate was skipped while the job stayed green. A missing percentage did the
      # same through `bc`. Compare in awk, and treat "threshold set, no number to
      # compare" as a failure, not a pass.
      - name: Check coverage threshold
        if: inputs.run_coverage && always()
        shell: bash
        env:
          LINE_THRESHOLD: ${{ inputs.coverage_line_threshold }}
          INSTR_THRESHOLD: ${{ inputs.coverage_instruction_threshold }}
          BRANCH_THRESHOLD: ${{ inputs.coverage_branch_threshold }}
          LINE_PCT: ${{ steps.coverage.outputs.percentage }}
          INSTR_PCT: ${{ steps.jacoco-log.outputs.instruction_pct }}
          BRANCH_PCT: ${{ steps.jacoco-log.outputs.branch_pct }}
          HAS_JACOCO_LOG: ${{ steps.jacoco-log.outputs.has_log }}
        run: |
          set -uo pipefail
          FAILED=false

          is_number() { [[ "$1" =~ ^[0-9]+([.][0-9]+)?$ ]]; }
          is_enabled() { is_number "$1" && awk -v t="$1" 'BEGIN { exit !(t > 0) }'; }
          is_below() { awk -v v="$1" -v t="$2" 'BEGIN { exit !(v < t) }'; }

          check() {
            local label=$1 pct=$2 threshold=$3
            if ! is_number "$pct"; then
              echo "::error::${label} coverage threshold is ${threshold}% but no coverage figure was produced (got '${pct}')"
              FAILED=true
            elif is_below "$pct" "$threshold"; then
              echo "::error::${label} coverage ${pct}% is below threshold of ${threshold}%"
              FAILED=true
            else
              echo "${label} coverage ${pct}% meets threshold of ${threshold}%"
            fi
          }

          echo "Line coverage: ${LINE_PCT:-n/a}%"
          if is_enabled "$LINE_THRESHOLD"; then check Line "$LINE_PCT" "$LINE_THRESHOLD"; fi
          if is_enabled "$INSTR_THRESHOLD" && [ "$HAS_JACOCO_LOG" = "true" ]; then
            check Instruction "$INSTR_PCT" "$INSTR_THRESHOLD"
          fi
          if is_enabled "$BRANCH_THRESHOLD" && [ "$HAS_JACOCO_LOG" = "true" ]; then
            check Branch "$BRANCH_PCT" "$BRANCH_THRESHOLD"
          fi

          if [ "$FAILED" = "true" ]; then
            echo "::error::Coverage quality gate failed. See details above."
            exit 1
          fi

      - name: Check test results
        id: test-check
        if: always()
        env:
          FAILED: ${{ steps.test-summary.outputs.failed }}
          EXIT_CODE: ${{ steps.test-run.outputs.exit_code || steps.test-run-maven.outputs.exit_code }}
        run: |
          if [ "${FAILED:-0}" -gt 0 ]; then
            echo "::error::$FAILED test(s) failed"
            exit 1
          fi
          # Gradle/Maven failed without a failing test report: compilation, a crashed fork,
          # a verification task. An empty code means the test step itself never ran.
          if [ "${EXIT_CODE:-1}" != "0" ]; then
            echo "::error::the test run exited with '${EXIT_CODE:-none}' and no test report explains it; see the test step log"
            exit 1
          fi

      # ============================================
      # UPLOAD REPORTS
      # ============================================
      - name: Check if Karate reports exist
        id: check-karate
        if: inputs.upload_reports && !inputs.disable_artifacts && always()
        run: |
          if [ -d "build/karate-reports" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload test reports
        if: inputs.upload_reports && !inputs.disable_artifacts && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            build/reports/tests/
            build/karate-reports/
            target/surefire-reports/
          retention-days: 7

      # ============================================
      # UPLOAD BUILD ARTIFACT (JAR)
      # ============================================
      - name: Get artifact info
        id: artifact-info
        if: inputs.upload_artifact && !inputs.disable_artifacts
        run: |
          JAR_FILE=$(find ${{ inputs.jar_path }} -name "*.jar" -not -name "*-plain.jar" | head -1)
          echo "path=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "name=build-artifact-${{ github.run_id }}" >> $GITHUB_OUTPUT

      - name: Upload build artifact
        if: inputs.upload_artifact && !inputs.disable_artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.artifact-info.outputs.name }}
          path: ${{ inputs.jar_path }}/*.jar
          retention-days: ${{ inputs.artifact_retention_days }}
