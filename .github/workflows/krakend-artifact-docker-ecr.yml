# DEPRECATED: Use shared-artifact-docker-ecr.yml instead
name: "[DEPRECATED] KrakenD - Docker Artifact to ECR"

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner type'
        required: false
        type: string
        default: 'ubuntu-latest'
      image_tag:
        description: 'Docker image tag. If empty, uses short commit SHA (7 chars)'
        required: false
        type: string
        default: ''
      push_latest:
        description: 'Also push :latest tag'
        required: false
        type: boolean
        default: false
      dockerfile_path:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: '.'
      docker_platform:
        description: 'Docker platform (linux/amd64, linux/arm64)'
        required: false
        type: string
        default: 'linux/arm64'
      environment:
        description: 'GitHub environment (develop, prod)'
        required: false
        type: string
        default: 'develop'

    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true

    outputs:
      image_tag:
        description: 'Docker image tag pushed'
        value: ${{ jobs.artifact.outputs.image_tag }}
      image_uri:
        description: 'Full Docker image URI'
        value: ${{ jobs.artifact.outputs.image_uri }}
      commit_sha:
        description: 'Short commit SHA used'
        value: ${{ jobs.artifact.outputs.commit_sha }}

# Least privilege for what this workflow actually does. Without it the
# job inherits whatever the calling repository's default happens to be,
# which on older repositories is write-all.
permissions:
  contents: read

jobs:
  deprecation-notice:
    name: Deprecated
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 2
    steps:
      - name: Warn the caller
        run: |
          echo "::warning title=Deprecated workflow::krakend-artifact-docker-ecr.yml is deprecated. \
          Call shared-artifact-docker-ecr.yml instead. This wrapper only forwards to it, and is scheduled \
          for removal in v2 — pinning @v1 keeps it working until you migrate."

  artifact:
    uses: ./.github/workflows/shared-artifact-docker-ecr.yml
    with:
      runner: ${{ inputs.runner }}
      image_tag: ${{ inputs.image_tag }}
      push_latest: ${{ inputs.push_latest }}
      dockerfile_path: ${{ inputs.dockerfile_path }}
      docker_platform: ${{ inputs.docker_platform }}
      environment: ${{ inputs.environment }}
      build_from_source: false
    secrets: inherit
