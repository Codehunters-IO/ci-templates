name: KrakenD - Build & Validate

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner type'
        required: false
        type: string
        default: 'ubuntu-latest'
      dockerfile_path:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: '.'

# Least privilege for what this workflow actually does. Without it the
# job inherits whatever the calling repository's default happens to be,
# which on older repositories is write-all.
permissions:
  contents: read

jobs:
  build:
    name: Build & Validate
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build & Validate KrakenD config
        run: |
          docker build -t krakend-app:ci ${{ inputs.dockerfile_path }}

          echo "### KrakenD Build & Validation" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Passed" >> $GITHUB_STEP_SUMMARY
