# DEPRECATED: Use shared-commit-lint.yml instead
name: "[DEPRECATED] KrakenD - Commit Lint"

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner type'
        required: false
        type: string
        default: 'ubuntu-latest'

jobs:
  deprecation-notice:
    name: Deprecated
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 2
    steps:
      - name: Warn the caller
        run: |
          echo "::warning title=Deprecated workflow::krakend-commit-lint.yml is deprecated. \
          Call shared-commit-lint.yml instead. This wrapper only forwards to it, and is scheduled \
          for removal in v2 — pinning @v1 keeps it working until you migrate."

  lint:
    uses: ./.github/workflows/shared-commit-lint.yml
    with:
      runner: ${{ inputs.runner }}
