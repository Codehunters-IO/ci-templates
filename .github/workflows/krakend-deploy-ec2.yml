# DEPRECATED: Use shared-deploy-ec2.yml instead
name: "[DEPRECATED] KrakenD - Deploy to EC2"

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner type'
        required: false
        type: string
        default: 'ubuntu-latest'
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        type: string
      environment:
        description: 'GitHub environment (develop, prod)'
        required: false
        type: string
        default: 'develop'
      docker_platform:
        description: 'Docker platform for the container (linux/amd64, linux/arm64)'
        required: false
        type: string
        default: 'linux/arm64'
      memory_limit:
        description: 'Container memory limit (e.g., 512m, 1g)'
        required: false
        type: string
        default: '512m'
      memory_reservation:
        description: 'Container memory reservation (e.g., 256m, 512m)'
        required: false
        type: string
        default: '256m'
      inject_aws_credentials:
        description: 'DEPRECATED. Forwarded to shared-deploy-ec2.yml: put the pipeline AWS credentials in the container environment. Off by default. Removed in v2.'
        required: false
        type: boolean
        default: false

    secrets:
      AWS_ECR_URL:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true
      AWS_EC2_HOST:
        required: true
      AWS_EC2_USER:
        required: true
      AWS_EC2_SSH_KEY:
        required: true
      AWS_APP_PORT:
        required: true

    outputs:
      deploy_status:
        description: 'Deployment status'
        value: ${{ jobs.deploy.outputs.deploy_status }}
      deployed_image:
        description: 'Deployed image tag'
        value: ${{ jobs.deploy.outputs.deployed_image }}

# Least privilege for what this workflow actually does. Without it the
# job inherits whatever the calling repository's default happens to be,
# which on older repositories is write-all.
permissions:
  contents: read

jobs:
  deprecation-notice:
    name: Deprecated
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 2
    steps:
      - name: Warn the caller
        run: |
          echo "::warning title=Deprecated workflow::krakend-deploy-ec2.yml is deprecated. \
          Call shared-deploy-ec2.yml instead. This wrapper only forwards to it, and is scheduled \
          for removal in v2 — pinning @v1 keeps it working until you migrate."

  deploy:
    uses: ./.github/workflows/shared-deploy-ec2.yml
    with:
      runner: ${{ inputs.runner }}
      image_tag: ${{ inputs.image_tag }}
      environment: ${{ inputs.environment }}
      docker_platform: ${{ inputs.docker_platform }}
      memory_limit: ${{ inputs.memory_limit }}
      memory_reservation: ${{ inputs.memory_reservation }}
      inject_aws_credentials: ${{ inputs.inject_aws_credentials }}
    secrets: inherit
