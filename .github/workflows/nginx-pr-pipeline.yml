name: NGINX - Pull Request Pipeline

# Quality gates only: commit lint, security, dependency review, build, test.
# No artifact, deploy, release, tag, cleanup or issue jobs.
#
# This does not wrap nginx-main-pipeline.yml, and that is the point. GitHub
# checks a reusable workflow's permissions statically, before any `if:` is
# evaluated, so wrapping the orchestrator would force every PR caller to grant
# the union of every stage it can run -- `contents: write`, `issues: write`,
# `id-token: write` -- for jobs that never execute. Calling the leaves directly
# keeps the ceiling at what they actually need: `contents: read`.
#
# The jobs below are copied from nginx-main-pipeline.yml with the same ids,
# conditions and inputs, so switching a caller over changes nothing else.

on:
  workflow_call:
    inputs:
      # Runner configuration
      runner:
        description: 'Runner type'
        required: false
        type: string
        default: 'ubuntu-latest'

      # NGINX configuration
      dockerfile_path:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: '.'

      # Pipeline steps control
      run_commit_lint:
        description: 'Run commit message validation'
        required: false
        type: boolean
        default: false

      run_trufflehog:
        description: 'Run TruffleHog secret scanning'
        required: false
        type: boolean
        default: false

      trufflehog_only_verified:
        description: 'Only report verified secrets'
        required: false
        type: boolean
        default: true

      trufflehog_fail_on_findings:
        description: 'Fail the workflow if secrets are found'
        required: false
        type: boolean
        default: true

      run_dependency_review:
        description: 'Run dependency review (PR only)'
        required: false
        type: boolean
        default: false

      dependency_review_severity:
        description: 'Minimum severity to fail: low, moderate, high, critical'
        required: false
        type: string
        default: 'high'

      run_build:
        description: 'Run build job (image build + nginx -t)'
        required: false
        type: boolean
        default: true

      run_test:
        description: 'Run test job (smoke /__health)'
        required: false
        type: boolean
        default: false

      # Test options
      health_path:
        description: 'Health endpoint path (smoke test)'
        required: false
        type: string
        default: '/__health'

    outputs:


# Every job below calls a leaf that declares read access and nothing more.
# Keep it that way: a leaf that needs more raises the ceiling for every PR
# caller, which is the problem this workflow exists to avoid. ci.yml asserts it.
permissions:
  contents: read

jobs:
  # ============================================
  # COMMIT LINT (parallel, no deps)
  # ============================================
  commit-lint:
    name: Commit Lint
    if: inputs.run_commit_lint
    uses: ./.github/workflows/shared-commit-lint.yml
    with:
      runner: ${{ inputs.runner }}

  # ============================================
  # SECURITY - TruffleHog (parallel, no deps)
  # ============================================
  security:
    name: Security Scan
    if: inputs.run_trufflehog
    uses: ./.github/workflows/security-trufflehog.yml
    with:
      runner: ${{ inputs.runner }}
      only_verified: ${{ inputs.trufflehog_only_verified }}
      fail_on_findings: ${{ inputs.trufflehog_fail_on_findings }}
    secrets: inherit

  # ============================================
  # SECURITY - Dependency Review (parallel, no deps)
  # ============================================
  dependency-review:
    name: Dependency Review
    if: inputs.run_dependency_review
    uses: ./.github/workflows/security-dependency-review.yml
    with:
      runner: ${{ inputs.runner }}
      fail_on_severity: ${{ inputs.dependency_review_severity }}
    secrets: inherit

  # ============================================
  # BUILD (Image build + nginx -t)
  # ============================================
  build:
    name: Build
    if: inputs.run_build
    uses: ./.github/workflows/nginx-build.yml
    with:
      runner: ${{ inputs.runner }}
      dockerfile_path: ${{ inputs.dockerfile_path }}
    secrets: inherit

  # ============================================
  # TEST (Smoke /__health)
  # ============================================
  test:
    name: Test (Smoke)
    if: inputs.run_test
    needs: build
    uses: ./.github/workflows/nginx-test.yml
    with:
      runner: ${{ inputs.runner }}
      dockerfile_path: ${{ inputs.dockerfile_path }}
      health_path: ${{ inputs.health_path }}
    secrets: inherit

  notify:
    name: Notify
    if: always()
    needs: [commit-lint, security, dependency-review, build, test]
    uses: ./.github/workflows/shared-notifications.yml
    with:
      status: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
    secrets: inherit
