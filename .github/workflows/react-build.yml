name: React - Build & Lint

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner type'
        required: false
        type: string
        default: 'ubuntu-latest'
      node_version:
        description: 'Node.js version. Ignored when node_version_file is set'
        required: false
        type: string
        default: '24'
      node_version_file:
        description: >-
          Read the Node version from this file (e.g. .nvmrc, .node-version)
          instead of the node_version input. Preferred when the repository
          already pins a version: a second copy in the caller is a second
          thing to keep in step.
        required: false
        type: string
        default: ''
      package_manager:
        description: 'Package manager: npm, yarn or pnpm'
        required: false
        type: string
        default: 'yarn'
      build_command:
        description: 'Build script name'
        required: false
        type: string
        default: 'build'
      build_output_dir:
        description: >-
          Build output path(s) to upload, one per line. 'build' for CRA, 'dist'
          for Vite/Rsbuild, a glob such as 'apps/*/dist' for a monorepo.
        required: false
        type: string
        default: 'build'
      run_lint:
        description: 'Run the lint script'
        required: false
        type: boolean
        default: true
      run_type_check:
        description: 'Run the type-check script (TypeScript projects)'
        required: false
        type: boolean
        default: false
      artifact_retention_days:
        description: 'Days to retain build artifact'
        required: false
        type: number
        default: 1

# Least privilege for what this workflow actually does. Without it the
# job inherits whatever the calling repository's default happens to be,
# which on older repositories is write-all.
permissions:
  contents: read

jobs:
  build:
    name: Build & Lint
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # An unrecognised value used to fall through to `npm ci`, which fails on a
      # repository that has no package-lock.json -- or worse, half-works. Fail
      # here instead, where the message names the input.
      - name: Resolve package manager
        id: pm
        env:
          PM: ${{ inputs.package_manager }}
        run: |
          set -euo pipefail
          case "$PM" in
            yarn) echo 'install=yarn install --frozen-lockfile' >> "$GITHUB_OUTPUT" ;;
            pnpm) echo 'install=pnpm install --frozen-lockfile' >> "$GITHUB_OUTPUT" ;;
            npm)  echo 'install=npm ci' >> "$GITHUB_OUTPUT" ;;
            *)    echo "::error::Unsupported package_manager '$PM' (expected npm, yarn or pnpm)"; exit 1 ;;
          esac
          echo "run=$PM run" >> "$GITHUB_OUTPUT"

      # Must precede setup-node: `cache: pnpm` resolves the store path by
      # running pnpm, so the binary has to exist first.
      - name: Setup pnpm
        if: inputs.package_manager == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Setup Node.js from ${{ inputs.node_version_file }}
        if: inputs.node_version_file != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ${{ inputs.node_version_file }}
          cache: ${{ inputs.package_manager }}

      - name: Setup Node.js ${{ inputs.node_version }}
        if: inputs.node_version_file == ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager }}

      - name: Install dependencies
        run: ${{ steps.pm.outputs.install }}

      - name: Lint
        if: inputs.run_lint
        run: ${{ steps.pm.outputs.run }} lint

      - name: Type check
        if: inputs.run_type_check
        run: ${{ steps.pm.outputs.run }} type-check

      - name: Build
        run: ${{ steps.pm.outputs.run }} ${{ inputs.build_command }}

      # An artifact that matched nothing used to upload empty with a warning,
      # and the deploy job downstream would then deploy nothing successfully.
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-output-${{ github.run_id }}
          path: ${{ inputs.build_output_dir }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
