# DEPRECATED: Use shared-delete-branch.yml instead
name: "[DEPRECATED] React - Delete Merged Branch"

on:
  workflow_call:
    inputs:
      branch_name:
        description: 'Branch name to delete (if empty, detects from merge commit)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Only log what would be deleted, do not actually delete'
        required: false
        type: boolean
        default: false

    outputs:
      deleted_branch:
        description: 'Name of deleted branch (empty if not deleted)'
        value: ${{ jobs.delete.outputs.deleted_branch }}
      status:
        description: 'Status: deleted, skipped, protected, not_found'
        value: ${{ jobs.delete.outputs.status }}

# Least privilege for what this workflow actually does. Without it the
# job inherits whatever the calling repository's default happens to be,
# which on older repositories is write-all.
permissions:
  contents: write

jobs:
  deprecation-notice:
    name: Deprecated
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Warn the caller
        run: |
          echo "::warning title=Deprecated workflow::react-delete-branch.yml is deprecated. \
          Call shared-delete-branch.yml instead. This wrapper only forwards to it, and is scheduled \
          for removal in v2 — pinning @v1 keeps it working until you migrate."

  delete:
    uses: ./.github/workflows/shared-delete-branch.yml
    with:
      branch_name: ${{ inputs.branch_name }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
