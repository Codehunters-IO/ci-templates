name: React - Pull Request Pipeline

# Quality gates only: commit lint, secret scan, dependency review, build, test.
# No deploy, release, tag, cleanup or issue jobs.
#
# This does not wrap react-main-pipeline.yml, and that is the point. GitHub
# checks a reusable workflow's permissions statically, before any `if:` is
# evaluated, so wrapping the orchestrator would force every PR caller to grant
# the union of every stage it can run -- `contents: write`, `issues: write`,
# `id-token: write` -- for jobs that never execute. Calling the leaves directly
# keeps the ceiling at what they actually need: `contents: read`.

on:
  workflow_call:
    inputs:
      # Runner configuration
      runner:
        description: 'Runner type'
        required: false
        type: string
        default: 'ubuntu-latest'

      # Node configuration
      node_version:
        description: 'Node.js version. Ignored when node_version_file is set'
        required: false
        type: string
        default: '24'
      node_version_file:
        description: >-
          Read the Node version from this file (e.g. .nvmrc, .node-version)
          instead of the node_version input. Preferred when the repository
          already pins a version.
        required: false
        type: string
        default: ''
      package_manager:
        description: 'Package manager: npm, yarn or pnpm'
        required: false
        type: string
        default: 'yarn'

      # Security
      run_commit_lint:
        description: 'Run commit message validation'
        required: false
        type: boolean
        default: false
      run_trufflehog:
        description: 'Run TruffleHog secret scanning'
        required: false
        type: boolean
        default: false
      trufflehog_only_verified:
        description: 'Only report verified secrets'
        required: false
        type: boolean
        default: true
      trufflehog_fail_on_findings:
        description: 'Fail the workflow if secrets are found'
        required: false
        type: boolean
        default: true
      run_dependency_review:
        description: 'Run dependency review (PR only)'
        required: false
        type: boolean
        default: false
      dependency_review_severity:
        description: 'Minimum severity to fail: low, moderate, high, critical'
        required: false
        type: string
        default: 'high'

      # Quality gates
      run_test:
        description: 'Run test job (includes coverage)'
        required: false
        type: boolean
        default: true
      run_code_analysis:
        description: 'Run code analysis (requires run_test: true)'
        required: false
        type: boolean
        default: false
      code_analysis_tool:
        description: 'Code analysis tool: sonar or qodana'
        required: false
        type: string
        default: 'sonar'
      skip_quality_gate:
        description: 'Skip Quality Gate check'
        required: false
        type: boolean
        default: false

      # Build options
      build_command:
        description: >-
          Build script name -- a script name only, not a command line. It is
          validated against ^[A-Za-z0-9:_.-]+$; pass flags via build_args.
        required: false
        type: string
        default: 'build'
      build_args:
        description: 'Extra arguments appended to the build script'
        required: false
        type: string
        default: ''
      build_output_dir:
        description: >-
          Build output path(s) to upload, one per line. 'build' for CRA, 'dist'
          for Vite/Rsbuild, a glob such as 'apps/*/dist' for a monorepo.
        required: false
        type: string
        default: 'build'
      run_lint:
        description: 'Run the lint script during build'
        required: false
        type: boolean
        default: true
      run_type_check:
        description: 'Run the type-check script during build (TypeScript projects)'
        required: false
        type: boolean
        default: false

      # Test options
      test_command:
        description: 'Test script name'
        required: false
        type: string
        default: 'test'
      test_args:
        description: >-
          Extra arguments appended to the test script. Set it to '' on a
          monorepo task runner or any runner that rejects Jest's flags.
        required: false
        type: string
        default: '--coverage --ci'
      run_coverage:
        description: 'Parse a coverage summary and enforce coverage_line_threshold'
        required: false
        type: boolean
        default: true
      coverage_summary_path:
        description: 'Path to the istanbul json-summary report'
        required: false
        type: string
        default: 'coverage/coverage-summary.json'
      upload_reports:
        description: 'Upload the coverage report directory as an artifact'
        required: false
        type: boolean
        default: false
      coverage_line_threshold:
        description: 'Minimum line coverage percentage (0-100). 0 disables the gate'
        required: false
        type: number
        default: 0

    outputs:
      coverage:
        description: 'Code coverage percentage'
        value: ${{ jobs.test.outputs.coverage_percentage }}

# Every job below calls a leaf that declares `contents: read` and nothing
# more. Keep it that way: a leaf that needs more raises the ceiling for every
# PR caller, which is the problem this workflow exists to avoid.
permissions:
  contents: read

jobs:
  commit-lint:
    name: Commit Lint
    if: inputs.run_commit_lint
    uses: ./.github/workflows/shared-commit-lint.yml
    with:
      runner: ${{ inputs.runner }}

  security:
    name: Security Scan
    if: inputs.run_trufflehog
    uses: ./.github/workflows/security-trufflehog.yml
    with:
      runner: ${{ inputs.runner }}
      only_verified: ${{ inputs.trufflehog_only_verified }}
      fail_on_findings: ${{ inputs.trufflehog_fail_on_findings }}
    secrets: inherit

  dependency-review:
    name: Dependency Review
    if: inputs.run_dependency_review
    uses: ./.github/workflows/security-dependency-review.yml
    with:
      runner: ${{ inputs.runner }}
      fail_on_severity: ${{ inputs.dependency_review_severity }}
    secrets: inherit

  build:
    name: Build
    uses: ./.github/workflows/react-build.yml
    with:
      runner: ${{ inputs.runner }}
      node_version: ${{ inputs.node_version }}
      node_version_file: ${{ inputs.node_version_file }}
      package_manager: ${{ inputs.package_manager }}
      build_command: ${{ inputs.build_command }}
      build_args: ${{ inputs.build_args }}
      build_output_dir: ${{ inputs.build_output_dir }}
      run_lint: ${{ inputs.run_lint }}
      run_type_check: ${{ inputs.run_type_check }}
    secrets: inherit

  test:
    name: Test & Coverage
    if: inputs.run_test
    needs: build
    uses: ./.github/workflows/react-test.yml
    with:
      runner: ${{ inputs.runner }}
      node_version: ${{ inputs.node_version }}
      node_version_file: ${{ inputs.node_version_file }}
      package_manager: ${{ inputs.package_manager }}
      run_coverage: ${{ inputs.run_coverage }}
      coverage_summary_path: ${{ inputs.coverage_summary_path }}
      coverage_line_threshold: ${{ inputs.coverage_line_threshold }}
      test_command: ${{ inputs.test_command }}
      test_args: ${{ inputs.test_args }}
      upload_reports: ${{ inputs.upload_reports }}
      run_code_analysis: ${{ inputs.run_code_analysis }}
      code_analysis_tool: ${{ inputs.code_analysis_tool }}
      skip_quality_gate: ${{ inputs.skip_quality_gate }}
    secrets: inherit

  notify:
    name: Notify
    if: always()
    needs: [commit-lint, security, dependency-review, build, test]
    uses: ./.github/workflows/shared-notifications.yml
    with:
      status: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
    secrets: inherit
