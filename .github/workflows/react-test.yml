name: React - Test & Coverage

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner type'
        required: false
        type: string
        default: 'ubuntu-latest'
      node_version:
        description: 'Node.js version. Ignored when node_version_file is set'
        required: false
        type: string
        default: '24'
      node_version_file:
        description: >-
          Read the Node version from this file (e.g. .nvmrc, .node-version)
          instead of the node_version input.
        required: false
        type: string
        default: ''
      package_manager:
        description: 'Package manager: npm, yarn or pnpm'
        required: false
        type: string
        default: 'yarn'
      run_coverage:
        description: >-
          Parse a coverage summary and enforce coverage_line_threshold. The
          test command itself is not modified -- pass whatever flag your runner
          needs via test_args.
        required: false
        type: boolean
        default: true
      test_command:
        description: 'Test script name'
        required: false
        type: string
        default: 'test'
      test_args:
        description: >-
          Extra arguments appended to the test script. Defaults to the flags
          this workflow used to inject on its own, so an existing caller keeps
          the command it had. Set it to '' on a monorepo task runner or any
          runner that rejects Jest's flags.
        required: false
        type: string
        default: '--coverage --ci'
      coverage_summary_path:
        description: 'Path to the istanbul json-summary report'
        required: false
        type: string
        default: 'coverage/coverage-summary.json'
      coverage_line_threshold:
        description: >-
          Minimum line coverage percentage (0-100). 0 disables the gate, which
          is the default so the threshold is a per-repository ratchet rather
          than a global hardcode -- matching java-test.yml.
        required: false
        type: number
        default: 0
      upload_reports:
        description: 'Upload coverage reports as artifact'
        required: false
        type: boolean
        default: false
      run_code_analysis:
        description: 'Run code analysis'
        required: false
        type: boolean
        default: false
      code_analysis_tool:
        description: 'Code analysis tool: sonar or qodana'
        required: false
        type: string
        default: 'sonar'
      skip_quality_gate:
        description: 'Skip Quality Gate check'
        required: false
        type: boolean
        default: false

    outputs:
      result:
        description: 'Test result (success/failure)'
        value: ${{ jobs.test.outputs.result }}
      coverage_percentage:
        description: 'Code coverage percentage'
        value: ${{ jobs.test.outputs.coverage }}
      tests_passed:
        description: 'Number of tests passed'
        value: ${{ jobs.test.outputs.passed }}
      tests_failed:
        description: 'Number of tests failed'
        value: ${{ jobs.test.outputs.failed }}
      quality_gate_status:
        description: 'Quality Gate status (Sonar/Qodana)'
        value: ${{ jobs.test.outputs.quality_gate }}

# Least privilege for what this workflow actually does. Without it the
# job inherits whatever the calling repository's default happens to be,
# which on older repositories is write-all.
permissions:
  contents: read

jobs:
  test:
    name: Test & Coverage
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_URL }}

    outputs:
      result: ${{ steps.test-run.outputs.status == '0' && 'success' || 'failure' }}
      coverage: ${{ steps.coverage.outputs.percentage }}
      passed: ${{ steps.test-summary.outputs.passed }}
      failed: ${{ steps.test-summary.outputs.failed }}
      quality_gate: ${{ steps.quality-gate.outputs.quality-gate-status }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Resolve package manager
        id: pm
        env:
          PM: ${{ inputs.package_manager }}
        run: |
          set -euo pipefail
          case "$PM" in
            yarn) echo 'install=yarn install --frozen-lockfile' >> "$GITHUB_OUTPUT" ;;
            pnpm) echo 'install=pnpm install --frozen-lockfile' >> "$GITHUB_OUTPUT" ;;
            npm)  echo 'install=npm ci' >> "$GITHUB_OUTPUT" ;;
            *)    echo "::error::Unsupported package_manager '$PM' (expected npm, yarn or pnpm)"; exit 1 ;;
          esac
          echo "run=$PM run" >> "$GITHUB_OUTPUT"
          # npm parses flags after the script name as its own and passes
          # nothing to the script -- `npm run test --coverage` reaches the
          # runner with an empty argv. It needs the `--` separator; yarn and
          # pnpm forward positionally and must not get one.
          if [ "$PM" = "npm" ]; then
            echo "args_sep=--" >> "$GITHUB_OUTPUT"
          else
            echo "args_sep=" >> "$GITHUB_OUTPUT"
          fi

      # Must precede setup-node: `cache: pnpm` resolves the store path by
      # running pnpm, so the binary has to exist first.
      - name: Setup pnpm
        if: inputs.package_manager == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Setup Node.js from ${{ inputs.node_version_file }}
        if: inputs.node_version_file != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: ${{ inputs.node_version_file }}
          cache: ${{ inputs.package_manager }}

      - name: Setup Node.js ${{ inputs.node_version }}
        if: inputs.node_version_file == ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager }}

      - name: Install dependencies
        run: ${{ steps.pm.outputs.install }}

    # ============================================
    # SONARQUBE ANALYSIS
    # ============================================
      - name: SonarQube Scan
        if: inputs.run_code_analysis && inputs.code_analysis_tool == 'sonar' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4  # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}

      - name: SonarQube Quality Gate
        id: quality-gate
        if: inputs.run_code_analysis && inputs.code_analysis_tool == 'sonar' && !inputs.skip_quality_gate && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa  # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}

      - name: SonarQube Quality Gate Summary
        if: inputs.run_code_analysis && inputs.code_analysis_tool == 'sonar' && !inputs.skip_quality_gate && env.SONAR_TOKEN != ''
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### SonarQube Quality Gate" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ steps.quality-gate.outputs.quality-gate-status }}" >> $GITHUB_STEP_SUMMARY

      # ============================================
      # RUN TESTS
      # ============================================
      # The test runner's own exit code is the verdict. It is recorded rather
      # than acted on here so the summary and coverage steps still run, and
      # `Check test results` below is what fails the job. The previous version
      # discarded it with `|| true` and derived the verdict purely from
      # grepping Jest's wording out of the log -- so any other reporter parsed
      # as zero tests, zero failures, and the gate passed having measured
      # nothing.
      - name: Run tests
        id: test-run
        env:
          PM_RUN: ${{ steps.pm.outputs.run }}
          ARGS_SEP: ${{ steps.pm.outputs.args_sep }}
          TEST_COMMAND: ${{ inputs.test_command }}
          TEST_ARGS: ${{ inputs.test_args }}
        run: |
          set -uo pipefail
          if ! [[ "$TEST_COMMAND" =~ ^[A-Za-z0-9:_.-]+$ ]]; then
            echo "::error::Invalid test_command: $TEST_COMMAND"
            exit 1
          fi
          # The default shell is `bash -e {0}`, and `set -uo pipefail` does not
          # clear that -e: without the `set +e` a failing runner aborts this
          # script at the pipeline, `status` is never written, and the gate
          # below reports an ordinary test failure as "did not report an exit
          # code". Verdict was still correct, message was not.
          # `set -f` stops the deliberate word-split from also glob-expanding:
          # test_args='*' would otherwise reach the runner as a file list.
          set +e
          set -f
          # Word-split on purpose: these are flags for the runner.
          $PM_RUN "$TEST_COMMAND" $ARGS_SEP $TEST_ARGS 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          set +f
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Test command exited with $status"

      - name: Parse test results
        id: test-summary
        if: always()
        env:
          STATUS: ${{ steps.test-run.outputs.status }}
        run: |
          PASSED=unknown
          FAILED=unknown

          if [ -f "test-output.log" ]; then
            # Strip SGR escapes before reading anything. GitHub sets CI=true,
            # and picocolors -- which rstest and vitest colour through --
            # enables escapes on that alone, with no TTY check, so the real
            # line on a runner is $'\033[1mTests:\033[22m \033[32m5 passed'.
            # Against the raw bytes the tally match fails twice over (a
            # lowercase 'm' lands before the word, and no whitespace follows
            # it), every count reads as `unknown`, and the failed-count gate
            # silently measures nothing -- the very defect this file fixes.
            sed -E $'s/\033\\[[0-9;]*[A-Za-z]//g' test-output.log > test-output.clean.log

            # Reporters disagree on wording and on order: Jest prints
            # "Tests: 2 failed, 3 passed", vitest "Tests  2 failed | 150 passed",
            # rstest "Tests 152 passed". Find the tally lines -- not "Test
            # Files", which counts something else -- then read each number out
            # of them wherever it sits.
            #
            # Anchored to the start of the line, allowing one task-runner
            # prefix such as `shell:test:`. Unanchored, a passing test whose
            # name contains both "tests" and a digit before "failed" --
            # describe('retry tests') / it('gives up after 3 failed attempts')
            # -- was counted as 3 real failures and failed a green run.
            #
            # Every tally line is summed, not just the last: a monorepo task
            # runner prints one per package, and taking the last reported one
            # package's count as the whole repository's.
            TALLY=$(grep -iE '^[[:space:]]*([A-Za-z0-9_@/.:-]+:)?[[:space:]]*tests:?[[:space:]]' test-output.clean.log \
              | grep -iE '[0-9][0-9,]*[[:space:]]+(passed|failed)' || true)
            # The `|| true` covers the whole pipeline, not just the first
            # grep: a run with no failures gives the second grep empty input
            # and it too exits 1, which under pipefail would fail the step on
            # a green test run. awk's END prints the 0 either way.
            # `tr -d ,` so a reporter that prints 1,234 is not read as 234.
            sum_of() {
              { grep -oiE "[0-9][0-9,]*[[:space:]]+$1" <<<"$TALLY" \
                | grep -oE '[0-9][0-9,]*' \
                | tr -d ',' \
                | awk '{total += $1} END {print total + 0}'; } || true
            }
            if [ -n "$TALLY" ]; then
              PASSED=$(sum_of passed)
              FAILED=$(sum_of failed)
            else
              PASSED=unknown
              FAILED=0
            fi
          fi

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT

          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| Exit code | ${STATUS:-none} |" >> $GITHUB_STEP_SUMMARY

      # ============================================
      # COVERAGE
      # ============================================
      - name: Parse coverage report
        id: coverage
        if: inputs.run_coverage && always()
        env:
          SUMMARY_PATH: ${{ inputs.coverage_summary_path }}
        run: |
          COVERAGE=0
          if [ -f "$SUMMARY_PATH" ]; then
            COVERAGE=$(SUMMARY_PATH="$SUMMARY_PATH" node -e "
              const report = require(process.env.SUMMARY_PATH.startsWith('/') ? process.env.SUMMARY_PATH : './' + process.env.SUMMARY_PATH);
              const pct = report.total.lines.pct;
              console.log(typeof pct === 'number' ? pct.toFixed(1) : '0');
            " 2>/dev/null || echo "0")
          else
            echo "::warning::No coverage summary at $SUMMARY_PATH"
          fi

          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
          # The directory the upload step publishes. Expressions have no
          # dirname, so it is computed here where the path already lives.
          echo "dir=$(dirname "$SUMMARY_PATH")" >> $GITHUB_OUTPUT

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Code Coverage" >> $GITHUB_STEP_SUMMARY
          echo "**Line Coverage: ${COVERAGE}%**" >> $GITHUB_STEP_SUMMARY

      - name: Check coverage threshold
        if: inputs.run_coverage && inputs.coverage_line_threshold > 0 && always()
        env:
          COVERAGE: ${{ steps.coverage.outputs.percentage }}
          THRESHOLD: ${{ inputs.coverage_line_threshold }}
        run: |
          set -euo pipefail
          # Validate before comparing. `bc` prints nothing on a non-numeric
          # operand, `[ "" -eq 1 ]` then errors, and a failing condition
          # inside `if` is exempt from -e -- so a malformed threshold or
          # percentage used to pass the gate instead of failing it.
          for pair in "COVERAGE=$COVERAGE" "THRESHOLD=$THRESHOLD"; do
            if ! [[ "${pair#*=}" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
              echo "::error::${pair%%=*} is not a number: '${pair#*=}'"
              exit 1
            fi
          done
          if [ "$(echo "$COVERAGE < $THRESHOLD" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold of ${THRESHOLD}%"
            exit 1
          fi

      # The gate. The runner's exit code decides; the parsed count is a second
      # chance to catch a runner that fails tests and still exits 0.
      - name: Check test results
        if: always()
        env:
          STATUS: ${{ steps.test-run.outputs.status }}
          FAILED: ${{ steps.test-summary.outputs.failed }}
        run: |
          set -uo pipefail
          if [ -z "${STATUS:-}" ]; then
            echo "::error::The test step did not report an exit code -- treating as failure"
            exit 1
          fi
          if [ "$STATUS" != "0" ]; then
            echo "::error::Test command exited with $STATUS"
            exit 1
          fi
          if [ "$FAILED" != "unknown" ] && [ "$FAILED" -gt 0 ] 2>/dev/null; then
            echo "::error::$FAILED test(s) failed"
            exit 1
          fi

      # ============================================
      # UPLOAD REPORTS
      # ============================================
      # Uploads the directory that holds coverage_summary_path, not a hardcoded
      # `coverage/`: a caller pointing the summary at apps/shell/coverage/
      # otherwise uploaded a path that does not exist. No `if-no-files-found:
      # error` here on purpose -- a missing report should not fail a green test
      # run, unlike a missing build artifact, which deploys nothing.
      - name: Upload coverage reports
        if: inputs.upload_reports && inputs.run_coverage && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-reports-${{ github.run_id }}
          path: ${{ steps.coverage.outputs.dir }}
          retention-days: 7
