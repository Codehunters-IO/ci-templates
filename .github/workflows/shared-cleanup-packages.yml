name: Shared - Cleanup Container Packages

# Prunes untagged versions from a GHCR container package.
#
# Untagged versions are what a registry accumulates on its own: every time a tag
# moves to a new digest the old manifest stays behind, unreferenced and
# unreachable, and buildx attestations add more. They are not deletable through
# any tag, so nothing removes them unless something is asked to.
#
# "Untagged" is not the same as "unreachable", and the difference is the whole
# problem. A multi-arch image publishes a manifest list that carries the tag and
# one child manifest per platform that carries none; buildx SBOM and provenance
# attestations are two more untagged children. On ci-base-images every one of
# the 32 children behind the 8 rolling tags is listed by the API as an untagged
# version. Deleting untagged versions therefore deletes the insides of images
# that are tagged, live, and being pulled — the tag survives pointing at nothing
# and `docker pull` fails with a manifest-unknown.
#
# So this does not filter on tags. It reads every tagged manifest out of the
# registry, collects what those manifests reference, and treats anything
# reachable from a tag as untouchable no matter how it is listed. Only versions
# that are both untagged and unreferenced are candidates.
#
# `keep_releases` extends that to tagged versions, for packages that publish a
# semver release per variant and want only the last few. Off by default (0).
# Set to N, it keeps the N newest releases and retires every other tagged
# version whose tags are all retirable: the semver tags of an older release
# (`1.2.0`, `1.2.0-graalvm`), aliases whose `X.Y` or `X` no kept release
# shares (`1.2`, `1.2-graalvm`), and `sha-*` build tags. A version with any
# other tag — `latest`, a rolling variant tag, a branch tag, anything this does
# not recognise — stays. Retired versions then go through the same walk as
# everything else: what a kept tag can reach survives, the rest of each retired
# image goes with it.
#
# `dry_run` defaults to true, and the plan is printed on every run including the
# deleting one.

on:
  workflow_call:
    inputs:
      package_name:
        description: 'Container package name (defaults to the repository name)'
        required: false
        type: string
        default: ''
      owner:
        description: 'Org or user that owns the package (defaults to the repository owner)'
        required: false
        type: string
        default: ''
      min_versions_to_keep:
        description: >-
          Minimum unreferenced versions to retain, newest first. Rounded up to
          a whole image, because an orphaned multi-arch image is an index plus
          its platform and attestation manifests and half of one is no use to
          anybody. Ten versions is about two images.
        required: false
        type: number
        default: 10
      keep_releases:
        description: >-
          Semver releases to keep, newest first; older releases and `sha-*`
          build tags are retired with their images. 0 (default) touches no
          tagged version. A suffix after X.Y.Z is read as a variant, not a
          pre-release.
        required: false
        type: number
        default: 0
      dry_run:
        description: 'Only report what would be deleted. Default true — deletion is opt-in.'
        required: false
        type: boolean
        default: true
      runner:
        description: 'Runner type'
        required: false
        type: string
        default: 'ubuntu-latest'

    outputs:
      total:
        description: 'Versions in the package before the run'
        value: ${{ jobs.cleanup.outputs.total }}
      tagged:
        description: 'Versions carrying at least one tag'
        value: ${{ jobs.cleanup.outputs.tagged }}
      untagged:
        description: 'Untagged versions found'
        value: ${{ jobs.cleanup.outputs.untagged }}
      referenced:
        description: >-
          Untagged versions that a tagged manifest still points at - platform
          and attestation manifests of live images. Never deletable.
        value: ${{ jobs.cleanup.outputs.referenced }}
      retired:
        description: 'Tagged versions retired by keep_releases'
        value: ${{ jobs.cleanup.outputs.retired }}
      deletable:
        description: >-
          Retired images plus untagged, unreferenced versions beyond
          min_versions_to_keep
        value: ${{ jobs.cleanup.outputs.deletable }}

permissions:
  packages: write

jobs:
  cleanup:
    name: Cleanup
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15

    outputs:
      total: ${{ steps.plan.outputs.total }}
      tagged: ${{ steps.plan.outputs.tagged }}
      untagged: ${{ steps.plan.outputs.untagged }}
      referenced: ${{ steps.plan.outputs.referenced }}
      retired: ${{ steps.plan.outputs.retired }}
      deletable: ${{ steps.plan.outputs.deletable }}

    steps:
      - name: Resolve package coordinates
        id: resolve
        env:
          IN_PACKAGE: ${{ inputs.package_name }}
          IN_OWNER: ${{ inputs.owner }}
        run: |
          set -euo pipefail
          PKG="${IN_PACKAGE:-${GITHUB_REPOSITORY#*/}}"
          OWNER="${IN_OWNER:-${GITHUB_REPOSITORY_OWNER}}"
          echo "package=${PKG}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER}"  >> "$GITHUB_OUTPUT"
          echo "Package: ${OWNER}/${PKG}"

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ steps.resolve.outputs.owner }}
          PKG: ${{ steps.resolve.outputs.package }}
          KEEP: ${{ inputs.min_versions_to_keep }}
          KEEP_RELEASES: ${{ inputs.keep_releases }}
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee plan.log
          import base64, json, os, re, subprocess, sys, urllib.error, urllib.request

          owner, pkg = os.environ["OWNER"], os.environ["PKG"]
          keep = int(os.environ["KEEP"])
          keep_releases = int(os.environ["KEEP_RELEASES"])
          repo_path = f"{owner}/{pkg}".lower()

          def api(path, *args):
              r = subprocess.run(["gh", "api", path, *args], capture_output=True, text=True)
              if r.returncode:
                  raise RuntimeError(r.stderr.strip())
              return r.stdout

          # Orgs and user accounts are different endpoints; the owner may be either.
          base = f"/orgs/{owner}/packages/container/{pkg}/versions"
          try:
              api(f"{base}?per_page=1")
          except RuntimeError:
              base = f"/users/{owner}/packages/container/{pkg}/versions"

          # --slurp gives an array of pages and refuses to run with --jq, so the
          # flattening happens here rather than in the query.
          pages = json.loads(api(base, "--paginate", "--slurp"))
          versions = [{"id": v["id"], "name": v["name"], "created_at": v["created_at"],
                       "tags": v.get("metadata", {}).get("container", {}).get("tags", [])}
                      for page in pages for v in page]

          # Registry read token. Basic auth with the job token works for the
          # package that belongs to this repository, private or not.
          auth = base64.b64encode(f"{os.environ.get('GITHUB_ACTOR','x')}:{os.environ['GH_TOKEN']}".encode()).decode()
          req = urllib.request.Request(
              f"https://ghcr.io/token?scope=repository:{repo_path}:pull&service=ghcr.io",
              headers={"Authorization": f"Basic {auth}"})
          reg_token = json.load(urllib.request.urlopen(req, timeout=30))["token"]

          ACCEPT = ("application/vnd.oci.image.index.v1+json,"
                    "application/vnd.docker.distribution.manifest.list.v2+json,"
                    "application/vnd.oci.image.manifest.v1+json,"
                    "application/vnd.docker.distribution.manifest.v2+json")

          # Cached, and with a timeout. Without the cache the reachability walk
          # and the grouping below fetch the same manifests twice; without the
          # timeout a stalled connection silently burns the job's whole budget.
          _cache = {}

          def manifest(digest):
              if digest not in _cache:
                  r = urllib.request.Request(
                      f"https://ghcr.io/v2/{repo_path}/manifests/{digest}",
                      headers={"Authorization": f"Bearer {reg_token}", "Accept": ACCEPT})
                  _cache[digest] = json.load(urllib.request.urlopen(r, timeout=30))
              return _cache[digest]

          # Retirement by release. A version is retired only when every tag it
          # carries is retirable, so one unrecognised or kept tag protects it.
          # Aliases (`1.2`, `1-graalvm`) count only when they belong to a
          # release that exists, which keeps a tag like `2026-10-05` from being
          # read as major 2026 and retired.
          SEMVER = re.compile(r"^(\d+)(?:\.(\d+))?(?:\.(\d+))?(?:-.+)?$")

          def semver(tag):
              m = SEMVER.match(tag)
              return tuple(None if g is None else int(g) for g in m.groups()) if m else None

          releases = sorted({s for v in versions for t in v["tags"]
                             if (s := semver(t)) and s[2] is not None}, reverse=True)
          kept = set(releases[:keep_releases])
          known_minor = {r[:2] for r in releases}
          known_major = {r[0] for r in releases}
          kept_minor = {r[:2] for r in kept}
          kept_major = {r[0] for r in kept}

          def retirable(tag):
              if tag.startswith("sha-"):
                  return True
              s = semver(tag)
              if s is None:
                  return False
              if s[2] is not None:
                  return s not in kept
              if s[1] is not None:
                  return s[:2] in known_minor and s[:2] not in kept_minor
              return s[0] in known_major and s[0] not in kept_major

          retired = []
          if keep_releases > 0 and not releases:
              print("::warning::keep_releases is set but no X.Y.Z tag was found; "
                    "retiring nothing.")
          elif keep_releases > 0:
              retired = [v for v in versions if v["tags"] and all(map(retirable, v["tags"]))]
          retired_names = {v["name"] for v in retired}

          # Everything reachable from a kept tag. One pass is enough in practice,
          # but the walk is transitive so a nested index cannot slip through.
          referenced, seen = set(), set()
          queue = [v["name"] for v in versions if v["tags"] and v["name"] not in retired_names]
          unreadable = []
          while queue:
              d = queue.pop()
              if d in seen:
                  continue
              seen.add(d)
              try:
                  m = manifest(d)
              except (urllib.error.HTTPError, urllib.error.URLError) as e:
                  unreadable.append((d, str(e)))
                  continue
              for child in m.get("manifests", []):
                  cd = child["digest"]
                  referenced.add(cd)
                  queue.append(cd)

          tagged = [v for v in versions if v["tags"]]
          untagged = [v for v in versions if not v["tags"]]
          reachable_untagged = [v for v in untagged if v["name"] in referenced]
          # A retired version a kept tag still reaches stays: a digest can be
          # shared, and the walk above is what decides.
          candidates = ([v for v in untagged if v["name"] not in referenced]
                        + [v for v in retired if v["name"] not in referenced])

          # Group the candidates back into the images they came from. An orphan
          # is rarely one version: a multi-arch image a tag has moved off leaves
          # its index, one manifest per platform and its attestations, and they
          # are only meaningful together. Retaining a count of versions can cut
          # through the middle of one and leave an index whose platforms are
          # gone - harmless, since nothing references it, but not a state worth
          # creating on purpose.
          by_name = {v["name"]: v for v in candidates}
          groups, claimed = [], set()
          for v in candidates:
              try:
                  kids = [c["digest"] for c in manifest(v["name"]).get("manifests", [])]
              except (urllib.error.HTTPError, urllib.error.URLError):
                  continue
              members = [v] + [by_name[k] for k in kids if k in by_name]
              if len(members) > 1:
                  groups.append(members)
                  claimed.update(m["name"] for m in members)
          groups += [[v] for v in candidates if v["name"] not in claimed]
          groups.sort(key=lambda g: max(m["created_at"] for m in g), reverse=True)

          # A manifest we could not read might reference anything, so nothing is
          # deleted on that run. Failing closed is the only safe direction here.
          # Emptying `groups`, not `candidates`: the groups are already built
          # from the candidates by this point, and they are what gets deleted.
          if unreadable:
              print(f"::error::{len(unreadable)} tagged manifests could not be read; "
                    "refusing to classify anything as deletable.")
              for d, e in unreadable[:5]:
                  print(f"  {d}: {e}")
              groups = []

          # A retired image goes whole and is not subject to min_versions_to_keep:
          # retiring it is the point. Orphans are retained whole until at least
          # `keep` versions are held, rounding up to an image boundary.
          retired_groups = [g for g in groups if any(m["tags"] for m in g)]
          orphan_groups = [g for g in groups if not any(m["tags"] for m in g)]
          retained_groups, held = 0, 0
          for g in orphan_groups:
              if held >= keep:
                  break
              retained_groups += 1
              held += len(g)
          deletable = ([v for g in retired_groups for v in g]
                       + [v for g in orphan_groups[retained_groups:] for v in g])

          out = {
              "total": len(versions), "tagged": len(tagged), "untagged": len(untagged),
              "referenced": len(reachable_untagged),
              "retired": sum(1 for g in retired_groups for m in g if m["tags"]),
              "deletable": len(deletable),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              for k, v in out.items():
                  fh.write(f"{k}={v}\n")
          with open("deletable-ids.txt", "w") as fh:
              fh.write("".join(f"{v['id']}\n" for v in deletable))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(f"### Package cleanup plan - `{owner}/{pkg}`\n\n")
              fh.write("| | Count |\n|---|---:|\n")
              fh.write(f"| Versions total | {out['total']} |\n")
              fh.write(f"| Tagged | {out['tagged']} |\n")
              fh.write(f"| Untagged | {out['untagged']} |\n")
              fh.write(f"| Untagged but reachable from a tag (protected) | {out['referenced']} |\n")
              if keep_releases > 0:
                  shown = ", ".join(".".join(map(str, r)) for r in sorted(kept, reverse=True))
                  fh.write(f"| Releases kept (`keep_releases: {keep_releases}`) | {shown or 'none'} |\n")
                  fh.write(f"| Tagged versions retired | {out['retired']} in {len(retired_groups)} images |\n")
              fh.write(f"| Orphaned images (index + platforms + attestations) | {len(orphan_groups)} |\n")
              fh.write(f"| Retained by `min_versions_to_keep` | {held} in {retained_groups} images |\n")
              fh.write(f"| **Would be deleted** | **{out['deletable']}** |\n\n")
              if retired_groups:
                  tags = sorted({t for g in retired_groups for m in g for t in m["tags"]
                                 if not t.startswith("sha-")})
                  fh.write(f"Release tags retired: {', '.join(f'`{t}`' for t in tags) or 'none'} "
                           f"(plus {sum(1 for g in retired_groups for m in g for t in m['tags'] if t.startswith('sha-'))} "
                           "`sha-*` build tags).\n\n")
              if reachable_untagged:
                  fh.write(f"{len(reachable_untagged)} untagged versions are platform or "
                           "attestation manifests belonging to a tagged image. Deleting them "
                           "would break `docker pull` on tags that still exist.\n\n")
          print(json.dumps(out))
          PY

      - name: Prune
        if: ${{ !inputs.dry_run && steps.plan.outputs.deletable != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ steps.resolve.outputs.owner }}
          PKG: ${{ steps.resolve.outputs.package }}
        run: |
          set -euo pipefail
          # Deleting by explicit id, not by a "delete everything untagged" flag:
          # the ids come from the plan above, which already excluded anything a
          # tag can reach.
          BASE="/orgs/${OWNER}/packages/container/${PKG}/versions"
          gh api "${BASE}?per_page=1" >/dev/null 2>&1 || BASE="/users/${OWNER}/packages/container/${PKG}/versions"
          n=0
          while IFS= read -r id; do
            [ -n "${id}" ] || continue
            gh api -X DELETE "${BASE}/${id}" --silent
            n=$((n + 1))
          done < deletable-ids.txt
          echo "Deleted ${n} versions."
          {
            echo "### Deleted"
            echo ""
            echo "Removed ${n} versions from \`${OWNER}/${PKG}\`: retired releases and builds, and unreferenced untagged versions."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report skip
        if: ${{ inputs.dry_run || steps.plan.outputs.deletable == '0' }}
        run: |
          {
            echo ""
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Nothing deleted: \`dry_run\` is on. Dispatch with it off to act on this plan."
            else
              echo "Nothing to delete."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
