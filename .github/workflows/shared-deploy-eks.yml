name: Shared - Deploy to EKS

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner type'
        required: false
        type: string
        default: 'ubuntu-latest'
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        type: string
      image_digest:
        description: >-
          Digest to deploy (sha256:…). When set, the deploy pins the image by
          digest and the tag is only a label. Empty deploys by tag, as Helm
          deploys do and as any direct caller that passes no digest does.
        required: false
        type: string
        default: ''
      environment:
        description: 'GitHub environment (develop, prod)'
        required: false
        type: string
        default: 'develop'
      cluster_name:
        description: 'EKS cluster name'
        required: true
        type: string
      namespace:
        description: 'Kubernetes namespace'
        required: false
        type: string
        default: 'default'
      deployment_name:
        description: 'Kubernetes deployment name (defaults to repo name)'
        required: false
        type: string
        default: ''
      container_name:
        description: 'Container name inside the deployment (defaults to repo name)'
        required: false
        type: string
        default: ''
      container_port:
        description: 'Container port'
        required: false
        type: number
        default: 8080
      replicas:
        description: 'Number of replicas'
        required: false
        type: number
        default: 1
      health_check_path:
        description: 'Health check endpoint path'
        required: false
        type: string
        default: '/actuator/health'
      rollout_timeout:
        description: 'Rollout timeout (e.g., 300s, 5m)'
        required: false
        type: string
        default: '300s'
      memory_limit:
        description: 'Container memory limit (e.g., 512Mi, 1Gi)'
        required: false
        type: string
        default: '512Mi'
      memory_request:
        description: 'Container memory request (e.g., 256Mi, 512Mi)'
        required: false
        type: string
        default: '256Mi'
      cpu_limit:
        description: 'Container CPU limit (e.g., 500m, 1)'
        required: false
        type: string
        default: '500m'
      cpu_request:
        description: 'Container CPU request (e.g., 250m, 500m)'
        required: false
        type: string
        default: '250m'

      # Helm options (alternative to kubectl)
      use_helm:
        description: 'Use Helm for deployment instead of kubectl'
        required: false
        type: boolean
        default: false
      helm_chart_path:
        description: 'Path to Helm chart'
        required: false
        type: string
        default: './helm'
      helm_values_file:
        description: 'Path to Helm values file'
        required: false
        type: string
        default: ''
      helm_set_values:
        description: 'Additional --set arguments (comma-separated key=value)'
        required: false
        type: string
        default: ''

      # Extra env vars for the container
      container_env_vars:
        description: 'Environment variables as KEY=VALUE pairs (one per line)'
        required: false
        type: string
        default: ''

      aws_role_to_assume:
        description: >-
          IAM role ARN to assume via GitHub OIDC. When set, no static access
          key is sent and AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are not
          read. Empty keeps the static-key path, which is the default so that
          existing consumers keep working.
        required: false
        type: string
        default: ''

    secrets:
      AWS_ECR_URL:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true

    outputs:
      deploy_status:
        description: 'Deployment status'
        value: ${{ jobs.deploy.outputs.status }}
      deployed_image:
        description: 'Deployed image URI'
        value: ${{ jobs.deploy.outputs.image }}

# Least privilege for what this workflow actually does. Without it the
# job inherits whatever the calling repository's default happens to be,
# which on older repositories is write-all.
permissions:
  contents: read
  # Inert unless aws_role_to_assume is set. A reusable workflow cannot
  # exceed its own declaration, so the OIDC path needs it declared here.
  id-token: write

jobs:
  deploy:
    name: Deploy to EKS
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    timeout-minutes: 15

    outputs:
      status: ${{ steps.deploy.outputs.status }}
      # Helm takes the repo:tag URI (image_uri); kubectl set image takes the
      # resolved ref, digest-pinned when available (image_ref). Report whichever
      # one the deploy step actually used, not always the kubectl one.
      image: ${{ inputs.use_helm && steps.setup.outputs.image_uri || steps.setup.outputs.image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          # One step, two paths. A long-lived access key in a repository secret
          # is a credential nobody rotates and everybody with write access can
          # exfiltrate; OIDC mints a token scoped to this repository that
          # expires with the job. The keys are only sent when no role is given,
          # because passing both makes the action assume the role *with* the
          # static key and the key stays in play.
          role-to-assume: ${{ inputs.aws_role_to_assume }}
          aws-access-key-id: ${{ inputs.aws_role_to_assume == '' && secrets.AWS_ACCESS_KEY_ID || '' }}
          aws-secret-access-key: ${{ inputs.aws_role_to_assume == '' && secrets.AWS_SECRET_ACCESS_KEY || '' }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup deployment vars
        id: setup
        env:
          AWS_ECR_URL: ${{ secrets.AWS_ECR_URL }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          DEPLOY_NAME: ${{ inputs.deployment_name }}
          CTR_NAME: ${{ inputs.container_name }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"

          if [ -z "$DEPLOY_NAME" ]; then
            DEPLOY_NAME="$REPO_NAME"
          fi

          if [ -z "$CTR_NAME" ]; then
            CTR_NAME="$REPO_NAME"
          fi

          IMAGE_REPO="${AWS_ECR_URL}/${REPO_NAME}"
          IMAGE_URI="${IMAGE_REPO}:${IMAGE_TAG}"
          # Helm keeps IMAGE_URI: charts take repository and tag separately, and a
          # digest ref split on ':' is garbage. kubectl takes the pinned ref.
          IMAGE_REF="${IMAGE_REPO}:${IMAGE_TAG}"
          if [ -n "${IMAGE_DIGEST}" ]; then IMAGE_REF="${IMAGE_REPO}@${IMAGE_DIGEST}"; fi

          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT
          echo "deploy_name=$DEPLOY_NAME" >> $GITHUB_OUTPUT
          echo "container_name=$CTR_NAME" >> $GITHUB_OUTPUT
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Update kubeconfig
        env:
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws eks update-kubeconfig \
            --name "$CLUSTER_NAME" \
            --region "$AWS_REGION"

      # ============================================
      # HELM DEPLOYMENT
      # ============================================
      - name: Deploy with Helm
        if: inputs.use_helm
        id: helm-deploy
        env:
          DEPLOY_NAME: ${{ steps.setup.outputs.deploy_name }}
          IMAGE_URI: ${{ steps.setup.outputs.image_uri }}
          CHART_PATH: ${{ inputs.helm_chart_path }}
          NAMESPACE: ${{ inputs.namespace }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REPLICAS: ${{ inputs.replicas }}
          ROLLOUT_TIMEOUT: ${{ inputs.rollout_timeout }}
          VALUES_FILE: ${{ inputs.helm_values_file }}
          SET_VALUES: ${{ inputs.helm_set_values }}
        # An argument array, not a string through eval: each value reaches helm
        # as one argument and is never re-read as shell.
        run: |
          ARGS=(upgrade --install "$DEPLOY_NAME" "$CHART_PATH"
            --namespace "$NAMESPACE" --create-namespace
            --set "image.repository=${IMAGE_URI%:*}"
            --set "image.tag=${IMAGE_TAG}"
            --set "replicaCount=${REPLICAS}"
            --wait --timeout "$ROLLOUT_TIMEOUT")

          if [ -n "$VALUES_FILE" ]; then
            ARGS+=(-f "$VALUES_FILE")
          fi

          if [ -n "$SET_VALUES" ]; then
            IFS=',' read -ra SETS <<< "$SET_VALUES"
            for s in "${SETS[@]}"; do
              ARGS+=(--set "$s")
            done
          fi

          echo "Running: helm ${ARGS[*]}"
          helm "${ARGS[@]}"

      # ============================================
      # KUBECTL DEPLOYMENT
      # ============================================
      - name: Check if deployment exists
        if: "!inputs.use_helm"
        id: check-deploy
        env:
          DEPLOY_NAME: ${{ steps.setup.outputs.deploy_name }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          if kubectl get deployment "$DEPLOY_NAME" \
            -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Update existing deployment
        if: "!inputs.use_helm && steps.check-deploy.outputs.exists == 'true'"
        env:
          DEPLOY_NAME: ${{ steps.setup.outputs.deploy_name }}
          CTR_NAME: ${{ steps.setup.outputs.container_name }}
          IMAGE_REF: ${{ steps.setup.outputs.image_ref }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          kubectl set image "deployment/${DEPLOY_NAME}" \
            "${CTR_NAME}=${IMAGE_REF}" \
            -n "$NAMESPACE"

      - name: Create new deployment
        if: "!inputs.use_helm && steps.check-deploy.outputs.exists == 'false'"
        env:
          DEPLOY_NAME: ${{ steps.setup.outputs.deploy_name }}
          CTR_NAME: ${{ steps.setup.outputs.container_name }}
          IMAGE_REF: ${{ steps.setup.outputs.image_ref }}
          NAMESPACE: ${{ inputs.namespace }}
          CONTAINER_ENV_VARS: ${{ inputs.container_env_vars }}
          REPLICAS: ${{ inputs.replicas }}
          CONTAINER_PORT: ${{ inputs.container_port }}
          MEMORY_REQUEST: ${{ inputs.memory_request }}
          CPU_REQUEST: ${{ inputs.cpu_request }}
          MEMORY_LIMIT: ${{ inputs.memory_limit }}
          CPU_LIMIT: ${{ inputs.cpu_limit }}
          HEALTH_CHECK_PATH: ${{ inputs.health_check_path }}
        run: |
          # Build env vars YAML block
          ENV_YAML=""
          if [ -n "$CONTAINER_ENV_VARS" ]; then
            ENV_YAML="          env:"
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                KEY="${line%%=*}"
                VALUE="${line#*=}"
                ENV_YAML="$ENV_YAML
                    - name: $KEY
                      value: \"$VALUE\""
              fi
            done <<< "$CONTAINER_ENV_VARS"
          fi

          cat <<MANIFEST | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${DEPLOY_NAME}
            namespace: ${NAMESPACE}
            labels:
              app: ${DEPLOY_NAME}
          spec:
            replicas: ${REPLICAS}
            selector:
              matchLabels:
                app: ${DEPLOY_NAME}
            template:
              metadata:
                labels:
                  app: ${DEPLOY_NAME}
              spec:
                containers:
                  - name: ${CTR_NAME}
                    image: ${IMAGE_REF}
                    ports:
                      - containerPort: ${CONTAINER_PORT}
                    resources:
                      requests:
                        memory: "${MEMORY_REQUEST}"
                        cpu: "${CPU_REQUEST}"
                      limits:
                        memory: "${MEMORY_LIMIT}"
                        cpu: "${CPU_LIMIT}"
                    readinessProbe:
                      httpGet:
                        path: ${HEALTH_CHECK_PATH}
                        port: ${CONTAINER_PORT}
                      initialDelaySeconds: 30
                      periodSeconds: 10
                    livenessProbe:
                      httpGet:
                        path: ${HEALTH_CHECK_PATH}
                        port: ${CONTAINER_PORT}
                      initialDelaySeconds: 60
                      periodSeconds: 30
          ${ENV_YAML}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: ${DEPLOY_NAME}
            namespace: ${NAMESPACE}
          spec:
            selector:
              app: ${DEPLOY_NAME}
            ports:
              - port: 80
                targetPort: ${CONTAINER_PORT}
            type: ClusterIP
          MANIFEST

          kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -

      - name: Wait for rollout
        if: "!inputs.use_helm"
        env:
          DEPLOY_NAME: ${{ steps.setup.outputs.deploy_name }}
          NAMESPACE: ${{ inputs.namespace }}
          ROLLOUT_TIMEOUT: ${{ inputs.rollout_timeout }}
        run: |
          kubectl rollout status "deployment/${DEPLOY_NAME}" \
            -n "$NAMESPACE" \
            --timeout="$ROLLOUT_TIMEOUT"

      # ============================================
      # STATUS & SUMMARY
      # ============================================
      - name: Set deploy status
        id: deploy
        if: always()
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          DEPLOY_NAME: ${{ steps.setup.outputs.deploy_name }}
          IMAGE_URI: ${{ steps.setup.outputs.image_uri }}
          NAMESPACE: ${{ inputs.namespace }}
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          REPLICAS: ${{ inputs.replicas }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if kubectl get deployment "$DEPLOY_NAME" \
            -n "$NAMESPACE" -o jsonpath='{.status.readyReplicas}' 2>/dev/null | grep -q "[1-9]"; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

          echo "### EKS Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Cluster** | ${CLUSTER_NAME} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Namespace** | ${NAMESPACE} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployment** | ${DEPLOY_NAME} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | ${IMAGE_URI} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Digest** | ${IMAGE_DIGEST:-none (deployed by tag)} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Replicas** | ${REPLICAS} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | ${ENVIRONMENT} |" >> $GITHUB_STEP_SUMMARY
