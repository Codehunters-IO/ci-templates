name: Shared - Notifications

# Zero-parameter Slack notifier. Everything is auto-derived from the triggering
# `workflow_run` event that the caller was fired on — status, branch, actor, run URL
# and any associated Pull Request. SLACK_WEBHOOK_URL is read from org-level `vars`.
on:
  workflow_call: {}

jobs:
  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL variable is not set, skipping notification"
            exit 0
          fi

          # Status → emoji / color
          case "$CONCLUSION" in
            success)   EMOJI="✅"; COLOR="#36a64f" ;;
            failure)   EMOJI="❌"; COLOR="#E01E5A" ;;
            cancelled) EMOJI="⚠️"; COLOR="#ECB22E" ;;
            *)         EMOJI="ℹ️"; COLOR="#1264A3" ;;
          esac

          # Pull Request context — populated for same-repo pull_request runs.
          # Title/author aren't in the workflow_run payload, so fetch them.
          PR_URL=""; PR_TITLE=""; PR_AUTHOR=""
          if [ -n "${PR_NUMBER:-}" ]; then
            PR_JSON=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" 2>/dev/null || echo '{}')
            PR_URL=$(echo "$PR_JSON" | jq -r '.html_url // ""')
            PR_TITLE=$(echo "$PR_JSON" | jq -r '.title // ""')
            PR_AUTHOR=$(echo "$PR_JSON" | jq -r '.user.login // ""')
            EMOJI="🔀"
          fi

          if [ -n "$PR_URL" ]; then
            TITLE="Pull Request #${PR_NUMBER} — ${REPO##*/}"
          else
            TITLE="${WF_NAME} ${CONCLUSION} — ${REPO##*/}"
          fi

          BLOCKS=$(jq -n --arg h "${EMOJI} ${TITLE}" \
            '[{"type":"header","text":{"type":"plain_text","text":$h,"emoji":true}}]')

          BLOCKS=$(echo "$BLOCKS" | jq \
            --arg repo "<${SERVER_URL}/${REPO}|${REPO}>" \
            --arg branch "\`${BRANCH}\`" \
            --arg status "${CONCLUSION}" \
            --arg actor "${ACTOR}" \
            '. += [{"type":"section","fields":[
              {"type":"mrkdwn","text":("*Repository:*\n" + $repo)},
              {"type":"mrkdwn","text":("*Branch:*\n" + $branch)},
              {"type":"mrkdwn","text":("*Status:*\n" + $status)},
              {"type":"mrkdwn","text":("*Actor:*\n" + $actor)}
            ]}]')

          if [ -n "$PR_URL" ]; then
            BLOCKS=$(echo "$BLOCKS" | jq \
              --arg pr "*Pull Request:*\n<${PR_URL}|#${PR_NUMBER} ${PR_TITLE}>" \
              --arg author "*Author:*\n${PR_AUTHOR:-N/A}" \
              '. += [{"type":"section","fields":[
                {"type":"mrkdwn","text":$pr},
                {"type":"mrkdwn","text":$author}
              ]}]')
            BTN_TEXT="View PR"; BTN_URL="$PR_URL"
          else
            BTN_TEXT="View Run"; BTN_URL="$RUN_URL"
          fi

          BLOCKS=$(echo "$BLOCKS" | jq --arg url "$BTN_URL" --arg t "$BTN_TEXT" \
            '. += [{"type":"actions","elements":[{"type":"button","text":{"type":"plain_text","text":$t},"url":$url}]}]')

          PAYLOAD=$(jq -n --argjson blocks "$BLOCKS" --arg color "$COLOR" \
            '{blocks: $blocks, attachments: [{color: $color, blocks: []}]}')

          HTTP_CODE=$(curl -s -o /tmp/slack_response.txt -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d "$PAYLOAD" "$SLACK_WEBHOOK_URL")

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "Slack notification sent"
          else
            echo "::warning::Slack notification failed (HTTP $HTTP_CODE)"
            cat /tmp/slack_response.txt
          fi
