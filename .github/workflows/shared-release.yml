name: Shared - Create Release Branch

# Simple release-branch flow (triggered on merge to develop):
#   develop --(semver)--> creates branch release/vX.Y.Z (pushed, targets main)
# This ONLY creates the branch. No PR is opened automatically — open the PR to main
# manually (or via your own process) when ready. Merging that branch to main deploys to
# CERT; production is reached only by a MANUAL semver tag vX.Y.Z (see tag-deploy / tag-pipeline).
#
# Required caller permissions:
#   contents: write        # create/push the release/vX.Y.Z branch

on:
  workflow_call:
    inputs:
      base_branch:
        description: 'Source branch the release is cut from (semver source)'
        required: false
        type: string
        default: 'develop'
      target_branch:
        description: 'Branch the release is intended for (used to detect "anything to release")'
        required: false
        type: string
        default: 'main'
      strict_flow:
        description: 'Enforce GitFlow: base_branch must be develop, target_branch must be main'
        required: false
        type: boolean
        default: true

    outputs:
      version:
        description: 'Computed release version (semver)'
        value: ${{ jobs.release.outputs.version }}
      release_branch:
        description: 'Release branch created (release/vX.Y.Z)'
        value: ${{ jobs.release.outputs.release_branch }}

concurrency:
  group: shared-release-${{ github.repository }}-${{ inputs.base_branch }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release Branch
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.semver.outputs.version }}
      release_branch: ${{ steps.branch.outputs.release_branch }}

    steps:
      - name: Validate release flow
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          STRICT_FLOW: ${{ inputs.strict_flow }}
        run: |
          echo "Release flow: $BASE_BRANCH -> release/vX.Y.Z (intended for $TARGET_BRANCH, strict=$STRICT_FLOW)"
          if [ "$STRICT_FLOW" != "true" ]; then
            echo "Strict flow disabled, skipping validation."
            exit 0
          fi
          ERRORS=0
          if [ "$BASE_BRANCH" != "develop" ]; then
            echo "::error::Release base_branch must be 'develop' under strict flow. Got: '$BASE_BRANCH'."
            ERRORS=1
          fi
          if [ "$TARGET_BRANCH" != "main" ]; then
            echo "::error::Release target_branch must be 'main' under strict flow. Got: '$TARGET_BRANCH'."
            ERRORS=1
          fi
          [ "$ERRORS" -eq 0 ] || { echo "Strict GitFlow requires develop -> main."; exit 1; }
          echo "Release flow validated."

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Calculate semantic version
        id: semver
        uses: PaulHatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR|BREAKING CHANGE)"
          minor_pattern: "(feat)"
          version_format: "${major}.${minor}.${patch}"

      - name: Guard against already-released version
        id: guard
        env:
          VERSION: ${{ steps.semver.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::warning::Tag ${TAG} already exists; this version was already released. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check branches diverged
        id: diff
        if: steps.guard.outputs.skip == 'false'
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git fetch --no-tags origin "${BASE_BRANCH}" "${TARGET_BRANCH}"
          AHEAD="$(git rev-list --count "origin/${TARGET_BRANCH}..origin/${BASE_BRANCH}")"
          if [ "${AHEAD}" -eq 0 ]; then
            echo "::warning::${BASE_BRANCH} has no commits ahead of ${TARGET_BRANCH}; nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release branch
        id: branch
        if: steps.guard.outputs.skip == 'false' && steps.diff.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.semver.outputs.version }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          RELEASE_BRANCH="release/v${VERSION}"
          echo "release_branch=${RELEASE_BRANCH}" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --heads origin "${RELEASE_BRANCH}" >/dev/null 2>&1; then
            echo "::notice::Branch ${RELEASE_BRANCH} already exists; leaving it as-is."
          else
            git push origin "origin/${BASE_BRANCH}:refs/heads/${RELEASE_BRANCH}"
            echo "::notice::Created ${RELEASE_BRANCH} from ${BASE_BRANCH}."
          fi

          {
            echo "### Release branch"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Version | v${VERSION} |"
            echo "| Branch | ${RELEASE_BRANCH} |"
            echo "| From | ${BASE_BRANCH} |"
            echo "| Intended target | ${{ inputs.target_branch }} |"
            echo ""
            echo "_Open a PR to \`${{ inputs.target_branch }}\` when ready (no PR is created automatically)._"
          } >> "$GITHUB_STEP_SUMMARY"
