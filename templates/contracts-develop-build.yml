# Template: Build + test on push to develop
# Copy to: .github/workflows/develop-build.yml
#
# Triggers on push to develop branch.
# Flow: build + test (no ECR push, no deploy).
#
# No AWS secrets required for this stage.

name: Develop Build & Test

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  pipeline:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    uses: Codehunters-IO/ci-templates/.github/workflows/contracts-main-pipeline.yml@v1
    with:
      # Node comes from the image, not from a per-run download. The tag pins
      # the version a repository declares in `engines` / `.nvmrc`.
      container_image: 'ghcr.io/codehunters-io/ci-base-images:1.0.0-node'
      run_build: true
      run_test: true
      run_coverage: false
    secrets: inherit
