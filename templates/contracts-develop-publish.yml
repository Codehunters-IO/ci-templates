# Template: Publish image on merge to develop
# Copy to: .github/workflows/develop-publish.yml
#
# Triggers on push to develop branch (after PR merge)
# Flow: build → test → coverage → artifact (ECR) → cleanup → release PR
# NOTE: No deployment to EC2/EKS — image is pushed to ECR only.
#       Downstream consumers (integration tests, other services) pull the image as needed.
#
# Required secrets:
#   AWS:
#   - AWS_ACCESS_KEY_ID: AWS access key for ECR push
#   - AWS_SECRET_ACCESS_KEY: AWS secret key
#   - AWS_REGION: AWS region (e.g., us-east-1)
#
#   ECR:
#   - AWS_ECR_URL: ECR registry URL
#
# Prerequisite (one-time):
#   aws ecr create-repository --repository-name vitxo-blockchain-contracts --region $AWS_REGION

name: Publish to Develop

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  id-token: write
  checks: write
  pull-requests: write

jobs:
  pipeline:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    uses: SOLDIFE/ci-templates/.github/workflows/contracts-main-pipeline.yml@main
    with:
      run_build: true
      run_test: true
      run_coverage: false
      run_artifact: true
      run_cleanup: true
      run_release: true
      environment: 'develop'
      release_target_branch: 'main'
    secrets: inherit
