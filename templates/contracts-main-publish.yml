# Template: Publish image on merge to main (production)
# Copy to: .github/workflows/main-publish.yml
#
# Triggers on push to main branch (after release merge)
# Flow: build → artifact (ECR, production environment) → tag
# NOTE: No on-chain deploy from CI. Real-network deploys happen out-of-band via a separate
#       gated workflow_dispatch job that this repo may add later.
#
# Required secrets: Same as develop-publish.yml

name: Publish to PRODUCTION

on:
  push:
    branches:
      - main

permissions:
  contents: write   # required by run_tag to push vX.Y.Z tag and create GitHub Release
  id-token: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    uses: SOLDIFE/ci-templates/.github/workflows/contracts-main-pipeline.yml@main
    with:
      run_build: true
      run_test: false
      run_artifact: true
      push_latest: true
      environment: 'production'
      run_tag: true
      run_notifications: true
      notify_mention_on_failure: '@channel'
    secrets: inherit
