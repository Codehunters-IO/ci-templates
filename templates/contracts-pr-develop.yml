# Template: PR to develop validation
# Copy to: .github/workflows/pr-develop.yml
#
# Triggers on pull requests targeting develop branch
# Runs: commit-lint + compile + size check + hardhat test + coverage + gas reporter
#
# Required secrets:
#   GitHub-provided GITHUB_TOKEN only (no AWS needed for PR validation)

name: PR Validation

on:
  pull_request:
    branches:
      - develop

# A newer push to the same PR or branch makes this run's answer stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# contracts-pr-pipeline.yml runs no deploy, release or issue job: read, plus
# packages: read for the container pulled from GHCR. Keep the block: without it
# the run inherits the repository's default, which on older repositories is
# write-all.
permissions:
  contents: read
  packages: read

jobs:
  validate:
    uses: Codehunters-IO/ci-templates/.github/workflows/contracts-pr-pipeline.yml@v2
    with:
      # Node comes from the image, not from a per-run download. The tag pins
      # the version a repository declares in `engines` / `.nvmrc`.
      container_image: 'ghcr.io/codehunters-io/ci-base-images:1-node'
      run_commit_lint: true
      run_dependency_review: true
      run_build: true
      run_test: true
      run_coverage: true
      coverage_threshold: 0
      run_gas_reporter: true
      upload_reports: true
    secrets: inherit
