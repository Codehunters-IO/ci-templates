# Template: Deploy on merge to develop
# Copy to: .github/workflows/develop-deploy.yml
#
# Triggers on push to develop branch (after PR merge)
# Flow: build -> test -> artifact (ECR) -> deploy -> delete branch -> release PR
# Image tag: commit SHA (7 chars)
#
# Required secrets:
#   Container registry & deploy target (provider-neutral):
#   - CONTAINER_REGISTRY_URL: Registry URL (ECR, DOCR, etc.)
#   - DEPLOY_HOST: Server IP or hostname
#   - DEPLOY_USER: SSH username (e.g., ubuntu, root)
#   - DEPLOY_SSH_KEY: SSH private key (PEM)
#   - APP_PORT: External port for the application
#
#   Provider-specific (only for the selected cloud_provider):
#   - cloud_provider: 'aws'         → AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
#   - cloud_provider: 'digitalocean' → DO_API_TOKEN
#
#   WireGuard (deploy_target: vm-vpn only):
#   - WG_PRIVATE_KEY, WG_ADDRESS, WG_PEER_PUBLIC_KEY, WG_PEER_ALLOWED_IPS, WG_PEER_ENDPOINT
#   - WG_DNS (optional)
#
#   Notifications (run_notifications: true):
#   - SLACK_WEBHOOK_URL: Slack incoming webhook URL (default provider)
#   - TEAMS_WEBHOOK_URL: Teams incoming webhook URL (notify_providers: 'slack,teams')
#
#   Optional:
#   - SONAR_HOST_URL / SONAR_TOKEN: SonarQube
#   - NVD_API_KEY: OWASP Dependency Check

name: Deploy to Develop

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  id-token: write
  checks: write
  pull-requests: write

jobs:
  pipeline:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    uses: <org>/ci-templates/.github/workflows/java-main-pipeline.yml@main
    with:
      run_build: true
      run_test: true
      run_coverage: true
      run_code_analysis: true
      code_analysis_tool: 'sonar'
      run_owasp: true
      run_architecture: true
      run_artifact: true
      artifact_registry: 'ecr'
      run_deploy: true
      deploy_target: 'vm-vpn'
      cloud_provider: 'aws'
      environment: 'develop'
      run_cleanup: true
      run_release: true
      release_target_branch: 'main'
      run_notifications: true
    secrets: inherit
