# Template: Validation of a multi-module Gradle library repository
# Copy to: .github/workflows/validate.yml
#
# Triggers:
#   - push to feature/*, fix/*, bugfix/*, hotfix/*, chore/*, docs/*, refactor/*
#   - pull_request -> main                      -> merge-ref gate (required status check)
#
# Runs java-pr-pipeline.yml: build (compile + Spotless, no tests), then a test job running
# `check`, so the repository's own verification tasks (per-module coverage rules, convention
# checks) gate the PR, plus a secret scan and commit lint. Publishes nothing; releases go
# through java-library-release-drafts.yml and java-library-publish.yml.
#
# Job id "validate" -> required status check context "validate / PR Quality Gates".

name: Validation

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'chore/**'
      - 'docs/**'
      - 'refactor/**'
  pull_request:
    branches:
      - main

# A newer push to the same PR or branch makes this run's answer stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    # java-pr-pipeline.yml runs no deploy, release or issue job: read, plus packages: read
    # for the JDK container pulled from GHCR.
    permissions:
      contents: read
      packages: read
    uses: <org>/ci-templates/.github/workflows/java-pr-pipeline.yml@v2
    with:
      run_commit_lint: true
      run_trufflehog: true
      run_test: true
      test_tasks: check
      # The build's own rules gate coverage per module; the pipeline's global gate stays off.
      run_coverage: false
      # extra_gradle_commands: |
      #   -p build-logic test
      # docker_images: |
      #   postgres:17-alpine
    secrets: inherit
