# Template: Deploy on merge to main (CERT environment)
# Copy to: .github/workflows/main-deploy.yml
#
# Triggers on push to main branch (after release merge)
# Runs: build + artifact + deploy (CERT environment)
#
# Production is NOT deployed here. Promotion to prod is a MANUAL git tag (vX.Y.Z)
# handled by tag-deploy.yml — do NOT enable run_tag here (tags must be created by a human).
#
# Required secrets: Same as develop-deploy.yml (including SLACK_WEBHOOK_URL for notify_on_failure / notify_on_deploy)

name: Deploy to Cert

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  pipeline:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    uses: <org>/ci-templates/.github/workflows/java-main-pipeline.yml@main
    with:
      run_build: true
      run_test: false
      run_artifact: true
      artifact_registry: 'ecr'
      run_deploy: true
      deploy_target: 'ec2-vpn'
      environment: 'cert'
      # spring_profiles: additional profiles only (concatenated with the environment 'cert'). None needed here.
      # run_tag intentionally omitted: prod promotion is a manual tag (see tag-deploy.yml)
      notify_on_failure: true
      notify_failure_mention: '@channel'
      notify_on_deploy: true
      # Mount TLS material/keystore from host into the container (read-only).
      # Place files at /opt/docker/<repo>/certs/ on the EC2 host before deploy.
      # Pair with container_env_vars (set in the pipeline) to point Spring Boot at them.
      # extra_volumes: |
      #   - ./certs:/etc/ssl/app:ro
    secrets: inherit
