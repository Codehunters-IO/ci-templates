# Template: Deploy on merge to develop
# Copy to: .github/workflows/develop-deploy.yml
#
# Triggers on push to develop branch (after PR merge)
# Flow: build → test → artifact (ECR) → deploy (EC2) → delete branch → create release PR
#
# Required secrets:
#   Container registry & deploy target (provider-neutral):
#   - CONTAINER_REGISTRY_URL: Registry URL (ECR, DOCR, etc.)
#   - DEPLOY_HOST: Server IP or hostname
#   - DEPLOY_USER: SSH username (e.g., ubuntu, root)
#   - DEPLOY_SSH_KEY: SSH private key
#   - APP_PORT: External port for KrakenD (maps to 8080)
#
#   Provider-specific (only for the selected cloud_provider):
#   - cloud_provider: 'aws'         → AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
#   - cloud_provider: 'digitalocean' → DO_API_TOKEN

name: Deploy to Develop

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  id-token: write
  checks: write
  pull-requests: write

jobs:
  pipeline:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    uses: <org>/ci-templates/.github/workflows/krakend-main-pipeline.yml@main
    with:
      run_build: true
      run_test: true
      run_artifact: true
      run_deploy: true
      deploy_target: 'vm'
      cloud_provider: 'aws'
      run_cleanup: true
      run_release: true
      environment: 'develop'
      release_target_branch: 'main'
    secrets: inherit
