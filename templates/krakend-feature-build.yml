# Template: Build on feature/bugfix branches
# Copy to: .github/workflows/feature-build.yml
#
# Triggers on every push to feature/* or bugfix/* branches
# Runs: config validation only (fast feedback)

name: Feature/Bugfix Build

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'

# A newer push to the same PR or branch makes this run's answer stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: <org>/ci-templates/.github/workflows/krakend-main-pipeline.yml@v2
    with:
      run_build: true
    secrets: inherit
