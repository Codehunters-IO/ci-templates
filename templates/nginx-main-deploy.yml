# Template: Deploy on merge to main (production)
# Copy to: .github/workflows/main-deploy.yml
#
# Triggers on push to main branch (after release merge)
# Runs: build + artifact + deploy (PRODUCTION)
#
# Required secrets: same as nginx-develop-deploy.yml
# Note: smoke test should have passed on release branch, only build and deploy here

name: Deploy to PRODUCTION

on:
  push:
    branches:
      - main

# Deploys on one ref run one at a time, in order. Never cancel one mid-flight:
# a half-applied deploy is worse than a late one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    uses: <org>/ci-templates/.github/workflows/nginx-main-pipeline.yml@v2
    with:
      run_build: true
      run_test: false
      run_artifact: true
      run_deploy: true
      deploy_target: 'ec2-vpn'
      environment: 'production'
      internal_port: '8080'
      run_tag: true
    secrets: inherit
