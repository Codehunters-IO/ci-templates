# Slack notifications — copy into your repo's .github/workflows/.
#
# Fires after the listed pipeline workflow(s) complete and sends a Slack message.
# Status, branch, actor, commit description, failed stage(s) and any associated Pull
# Request (title, author, reviewers) are auto-derived from the workflow_run event.
#
# Webhook routing via org-level variables (no parameters):
#   - PR runs      -> SLACK_WEBHOOK_URL_PR
#   - deploy runs  -> SLACK_WEBHOOK_URL_DEPLOY
#   - fallback     -> SLACK_WEBHOOK_URL
#
# Replace the workflow name(s) below with your repo's pipeline workflow name(s)
# (the `name:` at the top of each pipeline file), and <org> with your GitHub org.
name: Notify

on:
  workflow_run:
    workflows: ["Develop Pipeline", "Deploy to Cert", "PR Validation", "Release to Production"]
    types: [completed]

permissions:
  contents: read
  actions: read          # read run jobs to report the failed stage
  pull-requests: read     # read PR title/author/reviewers

jobs:
  notify:
    uses: <org>/ci-templates/.github/workflows/shared-notifications.yml@main
    secrets: inherit
