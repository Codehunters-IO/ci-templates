# Template: Deploy on merge to develop
# Copy to: .github/workflows/develop-deploy.yml
#
# Triggers on push to develop branch (after PR merge)
# Flow: build → test → deploy (S3) → delete branch
#
# Release PR (develop → main) is opened in parallel by release-pr.yml
# (copy templates/release-pr.yml into .github/workflows/ alongside this file).
# Tag vX.Y.Z is created on merge to main via run_tag in the main-deploy template.
#
# Required secrets:
#   AWS:
#   - AWS_ACCESS_KEY_ID: AWS access key
#   - AWS_SECRET_ACCESS_KEY: AWS secret key
#   - AWS_REGION: AWS region (e.g., us-east-1)
#   - AWS_S3_BUCKET: S3 bucket name for hosting
#
#   Optional:
#   - AWS_CLOUDFRONT_DISTRIBUTION_ID: CloudFront distribution for cache invalidation
#   - SONAR_URL: SonarQube server URL
#   - SONAR_TOKEN: SonarQube authentication token

name: Deploy to Develop

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  id-token: write
  checks: write
  pull-requests: write

jobs:
  pipeline:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    uses: <org>/ci-templates/.github/workflows/react-main-pipeline.yml@main
    with:
      run_build: true
      run_test: true
      run_code_analysis: true
      code_analysis_tool: 'sonar'
      run_deploy: true
      run_cleanup: true
      environment: 'develop'
    secrets: inherit
