# Template: Build on feature/bugfix branches
# Copy to: .github/workflows/feature-build.yml
#
# Triggers on every push to feature/* or bugfix/* branches
# Runs: build only (fast feedback)

name: Feature/Bugfix Build

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'

# A newer push to the same PR or branch makes this run's answer stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# react-pr-pipeline.yml runs no deploy, release or issue job, so read is all
# it needs. Keep the block: without it the run inherits the repository's
# default, which on older repositories is write-all.
permissions:
  contents: read

jobs:
  build:
    uses: <org>/ci-templates/.github/workflows/react-pr-pipeline.yml@v2
    with:
      run_test: false
    secrets: inherit
