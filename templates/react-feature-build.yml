# Template: Build on feature/bugfix branches
# Copy to: .github/workflows/feature-build.yml
#
# Triggers on every push to feature/* or bugfix/* branches
# Runs: build only (fast feedback)

name: Feature/Bugfix Build

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'

# A newer push to the same PR or branch makes this run's answer stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Required, not optional. A reusable workflow cannot exceed what its caller
# grants, and react-main-pipeline.yml requests the union of every stage it can
# run. On a repository whose default workflow permission is read-only, omitting
# this block makes the run fail at startup with zero jobs and no annotation
# saying why.
permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  build:
    uses: <org>/ci-templates/.github/workflows/react-main-pipeline.yml@v2
    with:
      run_build: true
    secrets: inherit
