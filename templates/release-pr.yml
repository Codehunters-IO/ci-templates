# Template: Open release PR on every push to develop
# Copy to: .github/workflows/release-pr.yml
#
# Runs independently of build/test/deploy. Creates or updates a single
# release PR from develop -> main. The PR is the integration gate; merging
# it triggers the production deploy (main-deploy.yml), which then creates
# the vX.Y.Z tag via run_tag.
#
# No language/stack coupling: same template works for Java, Kotlin, KrakenD,
# React, or anything else. Lives next to develop-deploy.yml.
#
# No secrets required. Uses default GITHUB_TOKEN.

name: Release PR

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  release-pr:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    uses: <org>/ci-templates/.github/workflows/shared-release.yml@main
    secrets: inherit
